name: Production schema drift

# Compares the live production database against supabase/schema.fingerprint
# (the schema the migrations in main produce). Fails if anyone changed
# production outside a migration, or if a merged migration was never applied.
# Runs every night, and right after any change to the schema lands on main.
#
# Needs the repo secret PRODUCTION_DB_URL: a Postgres connection string for
# production, ideally a read-only role (the check only reads the catalog).
# Without it the check fails — a check that can't run must not look green.
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      DRIFT_TARGET_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compare production with the committed schema
        run: |
          if [ -z "$DRIFT_TARGET_DB_URL" ]; then
            echo "::error::PRODUCTION_DB_URL secret is not set, so production was not checked. Add it under Settings → Secrets and variables → Actions (a read-only Postgres role is enough)."
            exit 1
          fi
          npm run db:drift -- --target
