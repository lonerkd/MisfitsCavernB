name: Secret scan

# The whole history, not just the PR diff: a credential once committed stays
# exposed even after the file is deleted (BACKLOG 3.16). PR diffs are also
# watched by GitGuardian; this catches what was committed before that, on any
# branch, forever.
#
# Findings accepted after a hand review live in `.gitleaksignore` (one
# fingerprint per line). Every entry there must have its written reason in the
# PR that added it — never add one without saying why it is safe.

on:
  schedule:
    - cron: '41 5 * * 1' # Mondays, off the deploy hours
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit — this job's point is the history
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan every reachable commit
        run: /tmp/gitleaks git . --log-opts="--all" --redact --verbose
