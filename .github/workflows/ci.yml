name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Legal identity for the build and the journeys (lib/legal/legal.ts reads these
# and fails the build without them). Fixture values: CI checks that the pages
# render whatever the environment says, not what production says.
env:
  LEGAL_OPERATOR: Test Operator
  LEGAL_COUNTRY: Canada
  LEGAL_PROVINCE: Alberta
  LEGAL_CONTACT_LABEL: '@test-operator on Instagram'
  LEGAL_CONTACT_URL: https://instagram.com/test-operator
  LEGAL_CONTACT_ALT_LABEL: '@test-operator on X'
  LEGAL_CONTACT_ALT_URL: https://x.com/test-operator
  LEGAL_EFFECTIVE: 1 January 2026

jobs:
  # What the PR touches. A docs-only change (Markdown, the knowledge hub)
  # can't break the schema or a journey, so it skips those jobs; `checks`
  # still runs. The database job runs when the schema or its callers change; the
  # browser journeys when anything a person can see or do changes. Pushes to main
  # run the database tests only (the PR already ran the journeys on the same code).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      db: ${{ steps.diff.outputs.db }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          # Pushes to main run the database tests (the schema must never drift) but not the
          # browser journeys: the PR already ran them on the same code.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            { echo "code=true"; echo "db=true"; echo "app=false"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          echo "$CHANGED"
          # Anything that is not prose or repo furniture can change behaviour.
          if echo "$CHANGED" | grep -qvE '\.md$|^\.cavern-intelligence/|^\.github/(ISSUE_TEMPLATE|pull_request_template|CODEOWNERS)|^\.env\.example$|^LICENSE$'; then CODE=true; else CODE=false; fi
          # The schema and what talks to it.
          if echo "$CHANGED" | grep -qE '^supabase/|^tests/integration/|^lib/supabase/|^lib/studio/|^package(-lock)?\.json$|^\.github/workflows/'; then DB=true; else DB=false; fi
          # What a person can do in a browser: pages, components, the engine, the specs.
          if echo "$CHANGED" | grep -qE '^(app|components|lib|public|e2e|supabase)/|^proxy\.ts$|^(next|playwright|tailwind|postcss)\.config|^package(-lock)?\.json$|^\.github/workflows/'; then APP=true; else APP=false; fi
          { echo "code=$CODE"; echo "db=$DB"; echo "app=$APP"; } | tee -a "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    env:
      # These are publishable (client-inlined) values, stored as repo *variables*
      # (Settings -> Actions -> Variables), so read them from vars.*, not secrets.*.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Real secret (server-only). The notify route builds its admin client
      # lazily inside the request handler, not at module scope, so `next
      # build` doesn't require this — set here for parity with runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CLAUDE.md, AGENTS.md and .github/copilot-instructions.md are generated
      # from .cavern-intelligence/RULES.md; fail if one was edited or is stale.
      - run: node scripts/sync-intel.js --check
      # The bible inventory is generated from the code (`npm run bible`); fail
      # if a change moved routes or tables without rebuilding the map — the
      # same pattern as db:types:check. (bible.mjs normalizes Windows paths,
      # so this reproduces on the owner's machine as well as on Linux.)
      - run: npm run bible
      - run: git diff --exit-code -- .cavern-intelligence/bible/inventory.md
      # A merged PR with no session note fails (history is shallow, so fetch
      # what the check reads). Runs on main only.
      - if: github.ref == 'refs/heads/main'
        run: |
          git fetch --shallow-since=2026-10-10 origin main
          npm run check-sessions
      - run: npm run typecheck
      - run: npm run lint
      # With the coverage report: thresholds live in vitest.config.ts, so this
      # step both runs the tests and fails if coverage drops below them
      # (BACKLOG 3.16 — "CI enforces the commit and coverage rules").
      - run: npm run test:coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
      # First-load JS per page stays within performance-budget.json.
      - run: npm run budget

  # The database is part of the build. Each run starts a fresh local Supabase
  # stack (Postgres + Auth + PostgREST + Realtime + Storage) from
  # supabase/migrations, then proves:
  #   1. the migrations build exactly the committed schema (no drift),
  #   2. the committed TypeScript types match that schema,
  #   3. real persona tests (Sam / Jordan / Riley / anon) pass against it —
  #      real auth, real RLS, no mocks.
  database:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:drift
      - run: npm run db:types:check
      - run: npm run test:integration

  # Every journey in a real browser against a fresh local stack: the Studio,
  # the editor, on set, the Lounge, the phone, accessibility (WCAG 2.2 A/AA,
  # axe) and the rest. It runs every spec in e2e/ (the public smoke specs
  # included), split five ways by how long each file takes
  # (scripts/e2e-shard.mjs, e2e/timings.json) — a new spec lands on a shard
  # without being listed. One worker per shard: the runner's 4 CPUs carry the
  # app, Postgres and the browser, and more workers only time out.
  e2e-local:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser installs while the stack starts (neither needs the other).
      - name: Local stack + browser
        run: |
          npx playwright install --with-deps chromium > /tmp/pw-install.log 2>&1 &
          PW=$!
          npm run db:start
          wait $PW || { cat /tmp/pw-install.log; exit 1; }
      - name: Journeys (real browser, local stack) — part ${{ matrix.shard }} of 5
        run: |
          STATUS=$(npx supabase status -o json)
          export NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)
          FILES=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 5)
          echo "$FILES" | tr ' ' '\n'
          E2E_LOCAL_STACK=1 E2E_LIVE_AUTH=1 npx playwright test $FILES
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
