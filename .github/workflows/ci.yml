name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # These are publishable (client-inlined) values, stored as repo *variables*
      # (Settings -> Actions -> Variables), so read them from vars.*, not secrets.*.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Real secret (server-only). The notify route builds its admin client
      # lazily inside the request handler, not at module scope, so `next
      # build` doesn't require this — set here for parity with runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # First-load JS per page stays within performance-budget.json.
      - run: npm run budget

  # The database is part of the build. Each run starts a fresh local Supabase
  # stack (Postgres + Auth + PostgREST + Realtime + Storage) from
  # supabase/migrations, then proves:
  #   1. the migrations build exactly the committed schema (no drift),
  #   2. the committed TypeScript types match that schema,
  #   3. real persona tests (Sam / Jordan / Riley / anon) pass against it —
  #      real auth, real RLS, no mocks.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:drift
      - run: npm run db:types:check
      - run: npm run test:integration

  # Every journey in a real browser against a fresh local stack: the Studio,
  # the editor, on set, the Lounge, the phone, accessibility (WCAG 2.2 A/AA,
  # axe) and the rest. It runs every spec in e2e/ — each skips itself unless
  # its stack is there — so a new spec can't be left out; split three ways to
  # run in parallel.
  e2e-local:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npx playwright install --with-deps chromium
      - name: Journeys (real browser, local stack) — part ${{ matrix.shard }} of 3
        run: |
          STATUS=$(npx supabase status -o json)
          export NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)
          E2E_LOCAL_STACK=1 E2E_LIVE_AUTH=1 npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: checks
    env:
      # These are publishable (client-inlined) values, stored as repo *variables*
      # (Settings -> Actions -> Variables), so read them from vars.*, not secrets.*.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Real secret (server-only), set here for parity with runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No PLAYWRIGHT_BASE_URL set: playwright.config.ts's webServer builds
      # and serves this checkout on localhost, so these specs test the PR's
      # own code — not the deployed production site.
      # Unauthenticated smoke specs only; authed journeys need a seeded test user.
      - run: npx playwright test e2e/home-page-crash.spec.ts e2e/auth-validation.spec.ts e2e/route-smoke.spec.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
