name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR replaces the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What the PR touches. A docs-only change (Markdown, the knowledge hub)
  # can't break the schema or a journey, so it skips those jobs; `checks`
  # still runs. Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '\.md$|^\.cavern-intelligence/'; then CODE=true; else CODE=false; fi
          echo "code=$CODE" | tee -a "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    env:
      # These are publishable (client-inlined) values, stored as repo *variables*
      # (Settings -> Actions -> Variables), so read them from vars.*, not secrets.*.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Real secret (server-only). The notify route builds its admin client
      # lazily inside the request handler, not at module scope, so `next
      # build` doesn't require this — set here for parity with runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CLAUDE.md, AGENTS.md and .github/copilot-instructions.md are generated
      # from .cavern-intelligence/RULES.md; fail if one was edited or is stale.
      - run: node scripts/sync-intel.js --check
      - run: npm run typecheck
      - run: npm run lint
      # With the coverage report: thresholds live in vitest.config.ts, so this
      # step both runs the tests and fails if coverage drops below them
      # (BACKLOG 3.16 — "CI enforces the commit and coverage rules").
      - run: npm run test:coverage
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
      # First-load JS per page stays within performance-budget.json.
      - run: npm run budget

  # The database is part of the build. Each run starts a fresh local Supabase
  # stack (Postgres + Auth + PostgREST + Realtime + Storage) from
  # supabase/migrations, then proves:
  #   1. the migrations build exactly the committed schema (no drift),
  #   2. the committed TypeScript types match that schema,
  #   3. real persona tests (Sam / Jordan / Riley / anon) pass against it —
  #      real auth, real RLS, no mocks.
  database:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:drift
      - run: npm run db:types:check
      - run: npm run test:integration

  # Every journey in a real browser against a fresh local stack: the Studio,
  # the editor, on set, the Lounge, the phone, accessibility (WCAG 2.2 A/AA,
  # axe) and the rest. It runs every spec in e2e/ (the public smoke specs
  # included), split five ways by how long each file takes
  # (scripts/e2e-shard.mjs, e2e/timings.json) — a new spec lands on a shard
  # without being listed. One worker per shard: the runner's 4 CPUs carry the
  # app, Postgres and the browser, and more workers only time out.
  e2e-local:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser installs while the stack starts (neither needs the other).
      - name: Local stack + browser
        run: |
          npx playwright install --with-deps chromium > /tmp/pw-install.log 2>&1 &
          PW=$!
          npm run db:start
          wait $PW || { cat /tmp/pw-install.log; exit 1; }
      - name: Journeys (real browser, local stack) — part ${{ matrix.shard }} of 5
        run: |
          STATUS=$(npx supabase status -o json)
          export NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)
          FILES=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 5)
          echo "$FILES" | tr ' ' '\n'
          E2E_LOCAL_STACK=1 E2E_LIVE_AUTH=1 npx playwright test $FILES
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
