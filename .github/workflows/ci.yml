name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # These are publishable (client-inlined) values, stored as repo *variables*
      # (Settings -> Actions -> Variables), so read them from vars.*, not secrets.*.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Real secret (server-only). The notify route builds its admin client
      # lazily inside the request handler, not at module scope, so `next
      # build` doesn't require this — set here for parity with runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # The database is part of the build. Each run starts a fresh local Supabase
  # stack (Postgres + Auth + PostgREST + Realtime + Storage) from
  # supabase/migrations, then proves:
  #   1. the migrations build exactly the committed schema (no drift),
  #   2. the committed TypeScript types match that schema,
  #   3. real persona tests (Sam / Jordan / Riley / anon) pass against it —
  #      real auth, real RLS, no mocks.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:drift
      - run: npm run db:types:check
      - run: npm run test:integration

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: checks
    env:
      # These are publishable (client-inlined) values, stored as repo *variables*
      # (Settings -> Actions -> Variables), so read them from vars.*, not secrets.*.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Real secret (server-only), set here for parity with runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No PLAYWRIGHT_BASE_URL set: playwright.config.ts's webServer builds
      # and serves this checkout on localhost, so these specs test the PR's
      # own code — not the deployed production site.
      # Unauthenticated smoke specs only; authed journeys need a seeded test user.
      - run: npx playwright test e2e/home-page-crash.spec.ts e2e/auth-validation.spec.ts e2e/route-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
