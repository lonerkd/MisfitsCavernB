name: Mobile audit

# The phone audit (scripts/mobile-audit.mjs) as a check: an iPhone 15 Pro, portrait and landscape, over 29 routes of the built app on
# the local stack. It fails when a route is worse than scripts/mobile-audit-baseline.json (sideways scroll, controls under a thumb,
# text too small, controls under a fixed bar, a field or its button hidden by the keyboard). The numbers only shrink: fix something,
# run `node scripts/mobile-audit.mjs --update`, commit the smaller baseline. Chromium imitates an iPhone; real Safari still needs a person.
# The same built app, stack and browser also run what only a browser finds, which no PR check ran before (2026-11-18): a page error or
# hydration error on 18 surfaces at three sizes (e2e/page-errors.spec.ts) and text that does not read in Paper, on every screen and in
# what opens on a click (scripts/theme-scan.mjs). Each found a real defect the week they were written. No new job: these are steps.
# Not a required check yet (as with claude-review: make it required after it has run green on a few real pull requests).
on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/os/**'
      - 'lib/island/**'
      - 'scripts/mobile-audit*'
      - 'scripts/theme-scan.mjs'
      - 'e2e/page-errors.spec.ts'
      - '.github/workflows/mobile-audit.yml'
  workflow_dispatch:

concurrency:
  group: mobile-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Local stack + browser
        run: |
          npx playwright install --with-deps chromium > /tmp/pw-install.log 2>&1 &
          PW=$!
          npm run db:start
          wait $PW || { cat /tmp/pw-install.log; exit 1; }
      - name: Build against the local stack and start it
        run: |
          STATUS=$(npx supabase status -o json)
          export NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)
          export NEXT_PUBLIC_APP_URL=http://localhost:3000
          npm run build
          nohup npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/auth && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/auth || { cat /tmp/server.log; exit 1; }
      - name: The audit, against the baseline
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: node scripts/mobile-audit.mjs mobile-audit --check
      - name: No page error or hydration error on any main surface
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_LOCAL_STACK: '1'
          E2E_LIVE_AUTH: '1'
        run: npx playwright test e2e/page-errors.spec.ts --trace off --workers=1
      - name: Every screen, and every state that opens on a click, reads in Paper
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: |
          node scripts/bible-shots.mjs projects > /dev/null   # seeds the demo world the scan signs in to
          THEME=paper node scripts/theme-scan.mjs
          THEME=paper node scripts/theme-scan.mjs --states
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-audit
          path: mobile-audit/
          retention-days: 7
