# Weekly dependency updates, grouped so they arrive as a few PRs, not dozens.
# Security fixes come as soon as they're published, regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    # Major versions (a new Next, React, Vitest…) need real migration work —
    # they're done on purpose in their own PR, not opened automatically.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
      supabase:
        patterns: ['@supabase/*', 'supabase']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/test', 'axe-core']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
