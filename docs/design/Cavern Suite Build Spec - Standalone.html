document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-display: swap;\n  src: url(\"0b1ae300-316d-4d04-bd32-49aad3494a6d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"e10207ff-bab8-4c5a-9d40-6bb25895b2bd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"4babd6e1-e23f-4db9-b13f-fedfe1b1a41e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"444b6c92-a590-4a52-a1e4-53cbf910e6c1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <script src=\"e1d2f59e-e428-4cd3-b64e-80a8d84bad08\"><\u002Fscript>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"doc-page\" from=\"e1d2f59e-e428-4cd3-b64e-80a8d84bad08#/doc-page.js\" size=\"letter\" margin=\"0.85in\" hint-size=\"100%,1100px\">\n  <div style=\"font-family:'DM Mono',monospace; color:#1a1712; font-size:13px; line-height:1.6;\">\n\n    <div style=\"border-bottom:2px solid #1a1712; padding-bottom:16px; margin-bottom:28px;\">\n      <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#d7340b;\">The Cavern — Build Specification<\u002Fdiv>\n      <h1 style=\"font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; margin:8px 0 4px;\">Suite Redesign: From Screens to System<\u002Fh1>\n      <div style=\"font-size:11px; color:#6b6350;\">Consolidates design turns 1a–11a. Grounded in the live codebase (supabase-schema.sql, app/studio, app/editor, app/projects, app/portfolio) — not idealized guesses.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border-bottom:1px solid #ccc4a8; padding-bottom:6px;\">0 — The Core Thesis<\u002Fh2>\n    <p>ScriptOS is the single owner of story data. Every other module — Studio, Lounge, Projects, Portfolio — reads it and derives an artifact; none re-own an editable copy. The unfair advantage over Final Draft / Arc Studio / Story Architect isn't typesetting, it's that the script sits on a live production database. The redesign leans into that at every layer instead of competing on page aesthetics.<\u002Fp>\n\n    <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border-bottom:1px solid #ccc4a8; padding-bottom:6px; margin-top:26px;\">1 — Phase Spine (type-aware)<\u002Fh2>\n    <p><code>projects.settings<\u002Fcode> drives a per-project-type phase template off the real <code>projects.status<\u002Fcode> enum: Feature runs Concept → Pre → Prod → Post → Delivery; Documentary skips Pre; Music Video collapses to Concept → Shoot → Edit; Podcast to Plan → Record → Edit → Publish. <strong>Gate rule:<\u002Fstrong> on-set surfaces (call sheets, shoot-day status, dailies) should not exist before Script Lock; casual story-structure editing should not happen after it.<\u002Fp>\n\n    <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border-bottom:1px solid #ccc4a8; padding-bottom:6px; margin-top:26px;\">2 — Module-by-Module Spec<\u002Fh2>\n\n    <h3 style=\"font-size:15px; margin-top:16px;\">2.1 ScriptOS (ref: 1a, 8a, 8b)<\u002Fh3>\n    <ul style=\"padding-left:20px;\">\n      <li><strong>Right panel:<\u002Fstrong> collapse 7 competing tabs (tools/characters/revisions/lint/audio/stash/breakdown) into 3–4 grouped tabs — Write / Insights / History / Audio — with collapsible sections inside. Raise type floor from 7–9px to 11–14px.<\u002Fli>\n      <li><strong>Page surface:<\u002Fstrong> real screenplay typesetting — Courier, bold sluglines, scene numbers in both margins, blocked dialogue/action per industry convention, current-line focus indicator, status bar naming the element + next keystroke.<\u002Fli>\n      <li><strong>Connected margin gutter:<\u002Fstrong> typed line-anchored annotations (shot / beat / note / revision / reference / todo), each routes to its owning department — a shot note lands in the shot list, a beat lands on the board, a todo lands on a call sheet/props list.<\u002Fli>\n      <li><strong>Production-aware sluglines:<\u002Fstrong> each scene heading carries live chips — status (planned/shot/wrapped), shoot day, page eighths, budget rollup — sourced from <code>scenes<\u002Fcode> + <code>budget_items<\u002Fcode>.<\u002Fli>\n      <li><strong>Live structure rail:<\u002Fstrong> Save-the-Cat/sequence overlay showing where the current scene sits, pacing flags (\"Act II lagging\"), per-character dialogue balance — surfaced in-margin, not a buried Stats tab.<\u002Fli>\n      <li><strong>Fix:<\u002Fstrong> the Breakdown tab currently renders hardcoded demo tags (Props: 'The Map', 'Briefcase') wired to nothing. Make it derive from the script and write to <code>scenes<\u002Fcode> + <code>budget_items<\u002Fcode> — this is the actual pre-production hinge (see 4).<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:15px; margin-top:16px;\">2.2 Studio — Pre-Production (ref: 2a, 4a, 5a, 6a, 10a)<\u002Fh3>\n    <ul style=\"padding-left:20px;\">\n      <li><strong>Split the Production tab<\u002Fstrong> (currently one dense 2-col grid of Beat Board + Crew + full Schedule) into Story / Schedule / Crew sub-tabs. Move Crew off the Concept/Story surface entirely.<\u002Fli>\n      <li><strong>Breakdown → Schedule → Budget bridge:<\u002Fstrong> tagging an element (cast/props/VFX/wardrobe/vehicles/background) on a scene should roll up into both the stripboard and the budget by category, live. <code>analyzeBudget()<\u002Fcode> in <code>app/projects/[id]/page.tsx<\u002Fcode> already does a version of this from script parsing — extend it into the real per-scene tagging UI instead of a one-shot suggestion button.<\u002Fli>\n      <li><strong>Stripboard + Day-Out-of-Days:<\u002Fstrong> color strips by shoot condition (INT/EXT × day/night, Movie Magic convention), length = page eighths, grouped by shoot day; DOOD computed per-actor from <code>cast_list<\u002Fcode> showing Start/Work/Hold/Finish.<\u002Fli>\n      <li><strong>Casting board:<\u002Fstrong> characters pulled from the ScriptOS bible (not re-typed), each with a casting slot (<code>character_castings<\u002Fcode> → crew, or \"Open — Post to Jobs\"), a look-board (<code>character_references → concept_assets<\u002Fcode>), and its scene/schedule footprint.<\u002Fli>\n      <li><strong>Concept boards + Library:<\u002Fstrong> keep real named-board filtering and type-filtered grid; raise to the suite's 12–15px type floor; give board chips the same selected-state pattern used elsewhere.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:15px; margin-top:16px;\">2.3 Lounge (ref: 7a)<\u002Fh3>\n    <ul style=\"padding-left:20px;\">\n      <li>Dock the Lounge beside active work rather than as a full-page destination — project channels + community channels (<code>channels.project_id = NULL<\u002Fcode>) always one glance away, collapsible to a notification rail.<\u002Fli>\n      <li><strong>Discord bridge<\u002Fstrong>, ordered by effort (you already have <code>profiles.discord_id/username/avatar<\u002Fcode>):\n        <br>1) Identity link via OAuth (columns exist — mostly the callback).\n        <br>2) Announce-only channels → Discord webhook (one-way, no bot — cheapest, highest value).\n        <br>3) Two-way channel mirror via bot + new <code>channels.discord_channel_id<\u002Fcode> column.\n        <br>4) Presence sync (nice-to-have).\n        <br>5) Voice: don't bridge audio (WebRTC mesh vs Discord SFU is a media-server project) — deep-link \"Join on Discord\" instead.\n      <\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:15px; margin-top:16px;\">2.4 Projects Hub (ref: 9a)<\u002Fh3>\n    <ul style=\"padding-left:20px;\">\n      <li>The DeptWindow grid + Production Manager (Tasks/Budget/Timeline/Crew/Festivals) is structurally solid and already does real Supabase CRUD — this is a density/type-scale pass, not a rebuild.<\u002Fli>\n      <li>Give the \"suggest from script breakdown\" budget flow a visible, findable home instead of one button among many.<\u002Fli>\n      <li>Festival submissions get real status color-coding (planned/submitted/accepted/rejected), matching casting/scene-status patterns elsewhere.<\u002Fli>\n    <\u002Ful>\n\n    <h3 style=\"font-size:15px; margin-top:16px;\">2.5 Portfolio &amp; Distribution (ref: 11a)<\u002Fh3>\n    <ul style=\"padding-left:20px;\">\n      <li>Showcase renders from <code>portfolio_blocks<\u002Fcode> snapshots, frozen at add-time — label them as such in the UI so nobody mistakes the public page for a live project view (anon visitors can't read source tables under current RLS).<\u002Fli>\n      <li>Merge Distribution (campaigns, festival tracking) into the same surface as Showcase — both are \"get the finished thing in front of people,\" currently split across <code>/portfolio<\u002Fcode> and <code>/jobs<\u002Fcode>.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border-bottom:1px solid #ccc4a8; padding-bottom:6px; margin-top:26px;\">3 — Schema Debt (found in supabase-schema.sql)<\u002Fh2>\n    <ul style=\"padding-left:20px;\">\n      <li><strong>Duplicate tables:<\u002Fstrong> <code>project_beats<\u002Fcode> vs <code>beats<\u002Fcode>, and <code>campaigns<\u002Fcode> vs <code>marketing_campaigns<\u002Fcode>. Pick one of each, migrate, drop the other.<\u002Fli>\n      <li><strong>Split-brain moodboards:<\u002Fstrong> <code>studio_assets/studio_boards<\u002Fcode> are owner-only while <code>concept_assets<\u002Fcode> are project-shared — a \"shared\" moodboard crew can't open is a real bug. Consolidate onto <code>concept_assets<\u002Fcode>.<\u002Fli>\n      <li><strong>Scattered characters:<\u002Fstrong> live JSONB bible in <code>script_metadata<\u002Fcode>, casting in <code>character_castings<\u002Fcode>, and an orphaned <code>script_characters/character_references<\u002Fcode> pair (0 rows). Name the JSONB bible the single owner; treat the rest as links or remove.<\u002Fli>\n      <li><strong>Missing bridge:<\u002Fstrong> the Script Breakdown is the real script↔schedule↔budget hinge and currently renders fake hardcoded data. This is the single highest-leverage fix in the codebase.<\u002Fli>\n    <\u002Ful>\n\n    <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border-bottom:1px solid #ccc4a8; padding-bottom:6px; margin-top:26px;\">4 — AI Policy<\u002Fh2>\n    <p>No AI on the writing surface by default. If AI assist ships at all, it lives behind a per-project opt-in toggle in Settings — off until a writer explicitly turns it on. Never a bar sitting on the page by default; filmmakers need to trust the surface with unpublished scripts.<\u002Fp>\n\n    <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border-bottom:1px solid #ccc4a8; padding-bottom:6px; margin-top:26px;\">5 — Suggested Build Order<\u002Fh2>\n    <ol style=\"padding-left:20px;\">\n      <li>Fix the Script Breakdown → wire it to real <code>scenes<\u002Fcode>/<code>budget_items<\u002Fcode> data (unblocks Studio's schedule/budget/casting work).<\u002Fli>\n      <li>ScriptOS right panel regroup (7 tabs → 3–4) + type-scale pass.<\u002Fli>\n      <li>Studio Production tab split (Story/Schedule/Crew) + stripboard/DOOD view.<\u002Fli>\n      <li>Casting board (depends on breakdown fix + crew/jobs chain).<\u002Fli>\n      <li>Lounge docking + Discord identity link (lowest-effort, highest immediate value).<\u002Fli>\n      <li>Projects Hub + Portfolio/Distribution density passes (lower risk, mostly visual).<\u002Fli>\n      <li>Schema cleanup (duplicate tables, moodboard consolidation, character sourcing) — do alongside whichever module touches that data next, not as a standalone migration sprint.<\u002Fli>\n    <\u002Fol>\n\n    <div style=\"margin-top:32px; padding-top:16px; border-top:1px solid #ccc4a8; font-size:11px; color:#6b6350;\">Reference mockups for every section above live in ScriptOS Right Panel Redesign.dc.html (sections 1a–11a).<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fx-import>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
