document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-items:flex-end; padding:28px 32px; border-bottom:1px solid rgba(224,221,174,0.08);\">\n        <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at 30% 60%, rgba(215,52,11,0.16) 0%, transparent 60%);\"><\u002Fdiv>\n        <div style=\"position:absolute; top:20px; right:28px; font-size:9px; letter-spacing:2px; color:rgba(224,221,174,0.3);\">2.35:1<\u002Fdiv>\n        <div style=\"position:relative;\">\n          <span style=\"font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:#ff8a5c; background:rgba(215,52,11,0.16); border:1px solid rgba(215,52,11,0.3); padding:4px 10px; border-radius:6px;\">Feature · Thriller<\u002Fspan>\n          <div style=\"font-family:'Bebas Neue',sans-serif; font-size:44px; letter-spacing:2px; color:#e0ddae; margin-top:12px;\">FEMME FATALE<\u002Fdiv>\n          <div style=\"font-size:11px; color:rgba(224,221,174,0.4); margin-top:4px;\">public.cavern.app/p/8x2f-mara — no account needed<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:28px 32px;\">\n        <div style=\"display:flex; gap:6px; margin-bottom:24px; border-bottom:1px solid rgba(224,221,174,0.08); padding-bottom:0;\">\n          <sc-for list=\"{{ tabs11a }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <button onclick=\"{{ t.onClick }}\" style=\"padding:11px 18px; background:transparent; border:none; cursor:pointer; font-size:13px; color:{{ t.color }}; border-bottom:2px solid {{ t.borderColor }};\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- SHOWCASE BLOCKS -->\n        <sc-if value=\"{{ isShowcase }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:14px;\">portfolio_blocks — snapshot, not live<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:10px;\">\n            <sc-for list=\"{{ blocks }}\" as=\"b\" hint adius:7px; color:#a5b4fc; cursor:pointer;\">🔍 Search reference<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ boards }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ b.onClick }}\" style=\"padding:7px 15px; border-radius:99px; font-size:11.5px; font-weight:600; cursor:pointer; border:1px solid {{ b.border }}; background:{{ b.bg }}; color:{{ b.color }};\">{{ b.name }} <span style=\"opacity:0.6; font-size:10px;\">{{ b.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;\">\n          <sc-for list=\"{{ conceptImages }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"aspect-ratio:3/4; border-radius:10px; overflow:hidden; position:relative; background:repeating-linear-gradient(45deg, {{ c.tint }}0e 0 10px, {{ c.tint }}1a 10px 20px); border:1px solid rgba(255,255,255,0.06);\">\n              <div style=\"position:absolute; bottom:0; left:0; right:0; padding:8px 10px; background:linear-gradient(transparent,rgba(0,0,0,0.75));\">\n                <div style=\"font-size:10px; color:#e0ddae;\">{{ c.title }}<\u002Fdiv>\n                <div style=\"font-size:8.5px; color:rgba(224,221,174,0.5); margin-top:2px;\">{{ c.board }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- LIBRARY -->\n      <sc-if value=\"{{ isLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:15px; color:#e0ddae; margin-bottom:18px;\">Digital Assets<\u002Fdiv>\n        <div style=\"display:flex; gap:6px; margin-bottom:22px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ assetTypes }}\" as=\"ty\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ ty.onClick }}\" style=\"padding:7px 16px; border-radius:99px; font-size:11px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border:1px solid {{ ty.border }}; background:{{ ty.bg }}; color:{{ ty.color }};\">{{ ty.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;\">\n          <sc-for list=\"{{ assets }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; overflow:hidden;\">\n              <div style=\"aspect-ratio:16/10; background:{{ a.color }}18; display:flex; align-items:center; justify-content:center; font-size:10px; color:{{ a.color }}; letter-spacing:1px; text-transform:uppercase;\">{{ a.type }}<\u002Fdiv>\n              <div style=\"padding:11px 13px;\">\n                <div style=\"font-size:12px; color:#e0ddae; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ a.name }}<\u002Fdiv>\n                <div style=\"font-size:10px; color:rgba(224,221,174,0.4); margin-top:3px;\">{{ a.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px; max-width:900px;\">\n      <div style=\"font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:12px;\">What changed<\u002Fdiv>\n      <ul style=\"color:rgba(224,221,174,0.65); font-family:'Cormorant Garamond',serif; font-size:16px; line-height:1.7; padding-left:18px; margin:0;\">\n        <li>Board chips get real counts and a selected state, same pattern as the casting/lint chips elsewhere — no new interaction to learn.<\u002Fli>\n        <li>Type filter pills on Library move to the same pill treatment as everywhere else in the suite (was plain mono-uppercase text buttons).<\u002Fli>\n        <li>Both tabs share one 12–15px type floor instead of the 9–11px labels the current build uses throughout.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"9a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:10px;\">\n      <span style=\"background:#8b5cf6; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">9A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">Projects Hub — the control room, refined<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px; color:rgba(224,221,174,0.5); line-height:1.6; max-width:900px; margin-bottom:22px;\">Good news from reading the real page: it's already doing more than 4a assumed — <span style=\"color:#a5b4fc;\">analyzeBudget()<\u002Fspan> already parses the script and suggests Cast/Props/Wardrobe/VFX budget lines from tagged elements, and jobs already post straight from a budget line. This isn't a rebuild, it's the same DeptWindow grid + Production Manager with the density pass the rest of the suite got.<\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:32px 36px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <div style=\"margin-bottom:22px;\">\n        <div style=\"font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:6px;\">Production Hub<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:2px; color:#e0ddae;\">Femme Fatale<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.45); margin-top:6px; max-width:560px;\">A cinematographer uncovers her partner's theft and has one night to decide what loyalty is worth.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- department grid -->\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:30px;\">\n        <sc-for list=\"{{ deptWindows }}\" as=\"d\" hint-placeholder-count=\"6\">\n          <div style=\"background:rgba(255,255,255,0.02); border:1px solid {{ d.border }}; border-radius:12px; overflow:hidden;\">\n            <div style=\"padding:9px 13px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; align-items:center; gap:7px;\">\n              <span style=\"font-size:8px; letter-spacing:2px; text-transform:uppercase; color:{{ d.color }};\">{{ d.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:14px 16px; min-height:64px;\">\n              <div style=\"font-size:13px; color:#e0ddae; margin-bottom:4px;\">{{ d.title }}<\u002Fdiv>\n              <div style=\"font-size:10.5px; color:rgba(224,221,174,0.4);\">{{ d.preview }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:11px 16px; border-top:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;\">\n              <div style=\"display:flex; gap:16px;\">\n                <sc-for list=\"{{ d.stats }}\" as=\"st\" hint-placeholder-count=\"2\">\n                  <div>\n                    <div style=\"font-size:13px; font-weight:700; color:#e0ddae;\">{{ st.value }}<\u002Fdiv>\n                    <div style=\"font-size:7px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(224,221,174,0.35);\">{{ st.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size:9px; letter-spacing:1px; text-transform:uppercase; color:{{ d.color }}; background:{{ d.bg }}; padding:5px 10px; border-radius:99px;\">Open →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- production manager panel -->\n      <div style=\"font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:14px;\">Production Management — real Supabase CRUD, not a mockup<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px;\">\n\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:16px;\">\n          <div style=\"font-size:12.5px; color:#e0ddae; margin-bottom:12px;\">Tasks<\u002Fdiv>\n          <sc-for list=\"{{ tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; align-items:center; gap:10px; padding:7px 0;\">\n              <span style=\"width:15px; height:15px; border-radius:4px; border:1px solid {{ t.color }}; color:#10b981; font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">{{ t.check }}<\u002Fspan>\n              <span style=\"font-size:11.5px; color:{{ t.textColor }}; text-decoration:{{ t.strike }};\">{{ t.title }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:16px;\">\n          <div style=\"display:flex; justify-content:space-between; margin-bottom:12px;\">\n            <span style=\"font-size:12.5px; color:#e0ddae;\">Budget<\u002Fspan>\n            <span style=\"font-size:12px; color:rgba(224,221,174,0.5); font-family:'DM Mono',monospace;\">$10,780<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ budgetItems }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; justify-content:space-between; padding:6px 0; font-size:11px;\">\n              <span style=\"color:rgba(224,221,174,0.65);\">{{ b.category }}<\u002Fspan>\n              <span style=\"color:#e0ddae; font-family:'DM Mono',monospace;\">${{ b.amount }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button style=\"margin-top:10px; width:100%; background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.28); color:#a5b4fc; border-radius:7px; padding:8px; font-size:10.5px; cursor:pointer;\">✦ Suggest from Script Breakdown<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:16px;\">\n          <div style=\"font-size:12.5px; color:#e0ddae; margin-bottom:12px;\">Festival Submissions<\u002Fdiv>\n          <sc-for list=\"{{ festivals }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; justify-content:space-between; align-items:center; padding:7px 0;\">\n              <span style=\"font-size:11.5px; color:rgba(224,221,174,0.7);\">{{ f.name }}<\u002Fspan>\n              <span style=\"font-size:9px; letter-spacing:0.5px; text-transform:uppercase; color:{{ f.color }}; background:{{ f.bg }}; padding:3px 9px; border-radius:99px;\">{{ f.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px; max-width:900px;\">\n      <div style=\"font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:12px;\">What changed<\u002Fdiv>\n      <ul style=\"color:rgba(224,221,174,0.65); font-family:'Cormorant Garamond',serif; font-size:16px; line-height:1.7; padding-left:18px; margin:0;\">\n        <li>Department tiles keep their real structure (title/tag/stats/preview/Open) but move off tiny 7–9px labels onto the same 11–13px floor as the rest of the suite.<\u002Fli>\n        <li>The suggest-from-breakdown budget flow — which already exists and already works — gets a visible, findable home instead of being one button among many in a dense panel.<\u002Fli>\n        <li>Festival submissions get real status color coding (planned/submitted/accepted/rejected), matching the pattern used for casting and scene status elsewhere.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"8b\" style=\"scroll-margin-top:40px; width:100%; max-width:1400px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:10px;\">\n      <span style=\"background:#ffaa00; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">8B<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">Beyond Final Draft / Arc / Story Architect — the script wired to the production<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px; color:rgba(224,221,174,0.5); line-height:1.6; max-width:900px; margin-bottom:22px;\">Those three are standalone documents — the best typesetting money can buy, with nothing underneath it. Femme Fatale's script sits on a live production database. This isn't a prettier page — it's a page that knows the shoot day, the budget, and where every note needs to land. Click the margin tags or a slugline chip to see it work.<\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <!-- toolbar -->\n      <div style=\"display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid rgba(224,221,174,0.07); background:#070d18;\">\n        <div>\n          <div style=\"font-size:13px; color:#e0ddae;\">Femme Fatale<\u002Fdiv>\n          <div style=\"font-size:10px; color:rgba(224,221,174,0.4);\">Draft 3 · autosaved 2m ago<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto; display:flex; align-items:center; gap:14px;\">\n          <div style=\"display:flex; align-items:center;\">\n            <sc-for list=\"{{ collab8b }}\" as=\"p\" hint-placeholder-count=\"3\">\n              <span style=\"width:24px; height:24px; border-radius:50%; background:{{ p.color }}; color:#040710; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:-6px; border:2px solid #070d18;\" title=\"{{ p.role }}\">{{ p.initials }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:10.5px; color:rgba(224,221,174,0.4);\">viewing as {{ viewerRoleLabel }}<\u002Fspan>\n          <div style=\"display:flex; gap:2px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:8px; padding:3px;\">\n            <sc-for list=\"{{ roleSwitch }}\" as=\"rl\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ rl.onClick }}\" style=\"font-size:10.5px; padding:6px 11px; border:none; border-radius:5px; cursor:pointer; background:{{ rl.bg }}; color:{{ rl.color }};\">{{ rl.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- STRUCTURE / PACING RAIL -->\n      <div style=\"padding:14px 20px; border-bottom:1px solid rgba(224,221,174,0.07); background:#060b13;\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:10px;\">\n          <span style=\"font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4);\">Live structure — Save-the-Cat overlay<\u002Fspan>\n          <span style=\"font-size:9px; color:rgba(224,221,174,0.3);\">·<\u002Fspan>\n          <span style=\"font-size:9px; color:rgba(224,221,174,0.4);\">pacing heat + dialogue balance, not a separate report<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:2px; height:22px; border-radius:5px; overflow:hidden; margin-bottom:8px;\">\n          <sc-for list=\"{{ beatOverlay }}\" as=\"bo\" hint-placeholder-count=\"8\">\n            <div style=\"flex:{{ bo.flex }}; background:{{ bo.color }}; position:relative; opacity:{{ bo.opacity }}; cursor:pointer;\" title=\"{{ bo.label }}\">\n              <sc-if value=\"{{ bo.isHere }}\" hint-placeholder-val=\"{{ false }}
