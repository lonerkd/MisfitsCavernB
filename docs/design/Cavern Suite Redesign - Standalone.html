style=\"accent-color:#d7340b; width:16px; height:16px;\">\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ INSIGHTS TAB ============ -->\n        <sc-if value=\"{{ isInsights }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <button onclick=\"{{ toggleBreakdown }}\" style=\"display:flex; justify-content:space-between; align-items:center; background:transparent; border:none; cursor:pointer; padding:2px 0;\">\n              <span style=\"font-size:14px; font-weight:500; color:#e0ddae;\">Breakdown<\u002Fspan>\n              <span style=\"color:rgba(224,221,174,0.4); font-size:15px;\">{{ breakdownArrow }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ breakdownOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; flex-direction:column; gap:9px; padding:6px 2px 4px;\">\n                <div style=\"display:flex; justify-content:space-between; font-size:12.5px; color:rgba(224,221,174,0.6);\"><span>Scenes<\u002Fspan><span style=\"color:#e0ddae;\">42<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:12.5px; color:rgba(224,221,174,0.6);\"><span>Est. runtime<\u002Fspan><span style=\"color:#e0ddae;\">~88 min<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:12.5px; color:rgba(224,221,174,0.6);\"><span>Pages<\u002Fspan><span style=\"color:#e0ddae;\">92<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:12.5px; color:rgba(224,221,174,0.6);\"><span>Words<\u002Fspan><span style=\"color:#e0ddae;\">18,204<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font-size:12.5px; color:rgba(224,221,174,0.6);\"><span>Dialogue / Action<\u002Fspan><span style=\"color:#e0ddae;\">54% / 46%<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"height:1px; background:rgba(224,221,174,0.07);\"><\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <button onclick=\"{{ toggleChars }}\" style=\"display:flex; justify-content:space-between; align-items:center; background:transparent; border:none; cursor:pointer; padding:2px 0;\">\n              <span style=\"font-size:14px; font-weight:500; color:#e0ddae;\">Character Report<\u002Fspan>\n              <span style=\"color:rgba(224,221,174,0.4); font-size:15px;\">{{ charsArrow }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ charsOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; flex-direction:column; gap:10px; padding:6px 2px 4px;\">\n                <sc-for list=\"{{ characters }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:10px; padding:12px;\">\n                    <div style=\"display:flex; justify-content:space-between; margin-bottom:8px;\">\n                      <span style=\"font-size:12.5px; font-weight:600; color:#ffaa00;\">{{ c.name }}<\u002Fspan>\n                      <span style=\"font-size:11px; color:rgba(224,221,174,0.5);\">{{ c.pct }}%<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"height:3px; background:rgba(255,255,255,0.1); border-radius:2px; margin-bottom:8px;\">\n                      <div style=\"height:100%; width:{{ c.pct }}%; background:#ffaa00; border-radius:2px;\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; gap:12px; font-size:10.5px; color:rgba(224,221,174,0.45);\">\n                      <span>{{ c.lines }} lines<\u002Fspan><span>{{ c.scenes }} scenes<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"height:1px; background:rgba(224,221,174,0.07);\"><\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <button onclick=\"{{ toggleLint }}\" style=\"display:flex; justify-content:space-between; align-items:center; background:transparent; border:none; cursor:pointer; padding:2px 0;\">\n              <div style=\"display:flex; align-items:center; gap:8px;\">\n                <span style=\"font-size:14px; font-weight:500; color:#e0ddae;\">Validation<\u002Fspan>\n                <span style=\"font-size:10.5px; padding:2px 8px; border-radius:5px; background:rgba(234,179,8,0.12); color:#eab308;\">2<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"color:rgba(224,221,174,0.4); font-size:15px;\">{{ lintArrow }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ lintOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; flex-direction:column; gap:8px; padding:6px 2px 4px;\">\n                <sc-for list=\"{{ lintIssues }}\" as=\"issue\" hint-placeholder-count=\"2\">\n                  <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-left:3px solid {{ issue.color }}; border-radius:8px; padding:10px 12px;\">\n                    <div style=\"display:flex; justify-content:space-between; margin-bottom:4px;\">\n                      <span style=\"font-size:10px; color:{{ issue.color }}; text-transform:uppercase; font-weight:700;\">{{ issue.type }}<\u002Fspan>\n                      <span style=\"font-size:10px; color:rgba(224,221,174,0.4);\">Line {{ issue.line }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px; color:rgba(224,221,174,0.75);\">{{ issue.message }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ HISTORY TAB ============ -->\n        <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;\">\n              <span style=\"font-size:14px; font-weight:500; color:#e0ddae;\">Revisions<\u002Fspan>\n              <button style=\"font-size:10.5px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:6px; padding:6px 11px; color:#e0ddae; cursor:pointer;\">Lock current<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <sc-for list=\"{{ revisions }}\" as=\"rev\" hint-placeholder-count=\"3\">\n                <div style=\"background:rgba(51,100,103,0.08); border:1px solid rgba(51,100,103,0.3); border-radius:10px; padding:13px;\">\n                  <div style=\"display:flex; justify-content:space-between; margin-bottom:5px;\">\n                    <span style=\"font-size:13px; font-weight:600; color:#5fa8ac;\">{{ rev.label }}<\u002Fspan>\n                    <span style=\"width:8px; height:8px; border-radius:50%; background:#5fa8ac; margin-top:4px;\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11px; color:rgba(224,221,174,0.5); margin-bottom:4px;\">{{ rev.date }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px; color:rgba(224,221,174,0.35); margin-bottom:10px;\">{{ rev.stats }}<\u002Fdiv>\n                  <div style=\"display:flex; gap:16px; padding-top:8px; border-top:1px solid rgba(51,100,103,0.2);\">\n                    <button style=\"font-size:11px; background:transparent; border:none; color:#5fa8ac; font-weight:600; cursor:pointer; padding:0;\">Restore<\u002Fbutton>\n                    <button style=\"font-size:11px; background:transparent; border:none; color:rgba(224,221,174,0.5); cursor:pointer; padding:0;\">Preview<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"height:1px; background:rgba(224,221,174,0.07);\"><\u002Fdiv>\n\n          <div>\n            <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;\">\n              <span style=\"font-size:14px; font-weight:500; color:#e0ddae;\">The Stash<\u002Fspan>\n              <button style=\"font-size:10.5px; background:rgba(255,255,255,0.06); border:none; padding:6px 11px; border-radius:6px; color:#e0ddae; cursor:pointer;\">+ Add selected<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:8px;\">\n              <sc-for list=\"{{ stashItems }}\" as=\"item\" hint-placeholder-count=\"2\">\n                <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:12px;\">\n                  <div style=\"font-size:12px; color:rgba(224,221,174,0.75); line-height:1.5; margin-bottom:10px;\">{{ item.text }}<\u002Fdiv>\n                  <div style=\"display:flex; justify-content:space-between; padding-top:8px; border-top:1px solid rgba(255,255,255,0.05);\">\n                    <span style=\"font-size:10.5px; color:rgba(224,221,174,0.4);\">{{ item.date }}<\u002Fspan>\n                    <div style=\"display:flex; gap:14px;\">\n                      <button style=\"font-size:11px; background:transparent; border:none; color:#0099ff; cursor:pointer; padding:0;\">Insert<\u002Fbutton>\n                      <button style=\"font-size:11px; background:transparent; border:none; color:#ef4444; cursor:pointer; padding:0;\">Delete<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ AUDIO TAB ============ -->\n        <sc-if value=\"{{ isAudio }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:14px; font-weight:500; color:#e0ddae; margin-bottom:4px;\">Project Audio<\u002Fdiv>\n          <div style=\"font-size:11.5px; color:rgba(224,221,174,0.45); line-height:1.5; margin-bottom:6px;\">Reference tracks and mood pieces uploaded to this project — play while you write.<\u002Fdiv>\n          <sc-for list=\"{{ audioRefs }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); border-radius:10px; padding:12px;\">\n              <button style=\"width:34px; height:34px; border-radius:50%; background:rgba(215,52,11,0.16); border:1px solid rgba(215,52,11,0.4); color:#ff8a5c; font-size:13px; cursor:pointer; flex-shrink:0;\">▶<\u002Fbutton>\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"font-size:12.5px; color:#e0ddae; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ a.title }}<\u002Fdiv>\n                <div style=\"font-size:10.5px; color:rgba(224,221,174,0.4);\">{{ a.duration }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:340px; padding-top:38px;\">\n    <div style=\"font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:12px;\">What changed<\u002Fdiv>\n    <ul style=\"color:rgba(224,221,174,0.65); font-family:'Cormorant Garamond',serif; font-size:16px; line-height:1.7; padding-left:18px; margin:0;\">\n      <li>7 tabs → 4 grouped tabs (Write · Insights · History · Audio) — nothing dropped, everything from the original 7 panels is here<\u002Fli>\n      <li>Insights sections (Breakdown / Characters / Validation) collapse independently instead of forcing every stat onto screen at once<\u002Fli>\n      <li>Full lint issue list, full stash with insert/delete, full revision list with restore/preview — all real, no summaries-only<\u002Fli>\n      <li>Removed the hardcoded fake Props/VFX/Wardrobe breakdown tags (they weren't wired to real data)<\u002Fli>\n      <li>Type floor raised from 7–9px to 11–14px; sprint/goal/view-options grouped under Write since they're all live-writing controls<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    active: 'write',\n    breakdownOpen: true,\n    charsOpen: true,\n    lintOpen: true,\n    sprintActive: true,\n    typewriter: false,\n    darkPreview: true,\n    sceneNumbers: true,\n    watermark: false,\n    prodTab: 'story',\n    selectedCat: null,\n    boardView: 'strips',\n    selectedChar: 'mara',\n    dockOpen: true,\n    loungeChannel: 'writers',\n    editorTab: 'write',\n    viewerRole: 'writer',\n    expandedNote: null,\n    tab10a: 'concept',\n    board10a: 'All',\n    type10a: 'All',\n    tab11a: 'showcase',\n  };\n\n  portfolioDist() {\n    const tab = this.state.tab11a;\n    const mkTab = (key, label) => ({ label, onClick: () => this.setState({ tab11a: key }), color: tab === key ? '#e0ddae' : 'rgba(224,221,174,0.4)', borderColor: tab === key ? '#00cc66' : 'transparent' });\n    return {\n      tabs11a: [mkTab('showcase', 'Showcase'), mkTab('dist', 'Distribution')],\n      isShowcase: tab === 'showcase', isDist: tab === 'dist',\n      blocks: [\n        { kind: 'Logline', text: 'A cinematographer uncovers her partner\\u2019s theft and has one night to decide what loyalty is worth.', color: '#d7340b', frozen: 'frozen Jul 2' },\n        { kind: 'Cast', text: 'Sloane Reyes, Marcus Bell, Priya Anand', color: '#ffaa00', frozen: 'frozen Jul 2' },\n        { kind: 'Stills', text: '6 concept images pinned from Studio', color: '#6366f1', frozen: 'frozen Jun 30' },\n        { kind: 'Crew', text: 'Director, DP, 1st AD, Editor credited', color: '#10b981', frozen: 'frozen Jul 2' },\n      ],\n      campaigns: [\n        { name: 'Festival push', platform: 'Instagram', color: '#ec4899', pct: 62, spent: '620', budget: '1,000' },\n        { name: 'Teaser launch', platform: 'YouTube', color: '#ef4444', pct: 30, spent: '150', budget: '500' },\n      ],\n      fests: [\n        { name: 'Sundance', status: 'submitted', color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },\n        { name: 'SXSW', status: 'planned', color: '#6b7280', bg: 'rgba(107,114,128,0.12)' },\n        { name: 'Tribeca', status: 'accepted', color: '#10b981', bg: 'rgba(16,185,129,0.12)' },\n      ],\n    };\n  }\n\n  studioLibrary() {\n    const tab = this.state.tab10a;\n    const mkTab = (key, label) => ({ label, onClick: () => this.setState({ tab10a: key }), color: tab === key ? '#e0ddae' : 'rgba(224,221,174,0.4)', borderColor: tab === key ? '#6366f1' : 'transparent' });\n    const activeBoard = this.state.board10a;\n    const boardList = [{ name: 'All', count: 14 }, { name: 'Wardrobe', count: 5 }, { name: 'Locations', count: 4 }, { name: 'Tone', count: 3 }, { name: 'Unsorted', count: 2 }];\n    const activeType = this.state.type10a;\n    const typeList = ['All', 'Image', 'Video', 'Audio', 'Document'];\n    const tints = ['#6366f1', '#d7340b', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];\n\n    return {\n      tabs10a: [mkTab('concept', 'Concept'), mkTab('library', 'Library')],\n      isConcept: tab === 'concept', isLibrary: tab === 'library',\n      boards: boardList.map(b => ({\n        name: b.name, count: b.count,\n        onClick: () => this.setState({ board10a: b.name }),\n        bg: activeBoard === b.name ? 'rgba(99,102,241,0.16)' : 'rgba(255,255,255,0.03)',\n        border: activeBoard === b.name ? 'rgba(99,102,241,0.4)' : 'rgba(255,255,255,0.08)',\n        color: activeBoard === b.name ? '#a5b4fc' : 'rgba(224,221,174,0.6)',\n      })),\n      conceptImages: [\n        { title: 'Dock at night ref', board: 'Locations', tint: tints[0] },\n        { title: 'Mara wardrobe test', board: 'Wardrobe', tint: tints[1] },\n        { title: 'Heat (1995) still', board: 'Tone', tint: tints[2] },\n        { title: 'Warehouse lighting', board: 'Locations', tint: tints[3] },\n        { title: 'Trench coat ref', board: 'Wardrobe', tint: tints[4] },\n        { title: 'Color palette board', board: 'Tone', tint: tints[5] },\n      ],\n      assetTypes: typeList.map(t => ({\n        label: t, onClick: () => this.setState({ type10a: t }),\n        bg: activeType === t ? 'rgba(224,221,174,0.9)' : 'rgba(255,255,255,0.03)',\n        border: activeType === t ? 'rgba(224,221,174,0.9)' : 'rgba(255,255,255,0.06)',\n        color: activeType === t ? '#040710' : 'rgba(224,221,174,0.6)',\n      })),\n      assets: [\n        { name: 'dock_night_take3.mov', type: 'Video', color: '#d7340b', meta: '1.2 GB · Jul 3' },\n        { name: 'mara_wardrobe_final.png', type: 'Image', color: '#6366f1', meta: '4.8 MB · Jun 30' },\n        { name: 'score_sketch_v2.wav', type: 'Audio', color: '#10b981', meta: '18 MB · Jun 28' },\n        { name: 'call_sheet_day3.pdf', type: 'Document', color: '#f59e0b', meta: '220 KB · Jul 1' },\n      ],\n    };\n  }\n\n  projectsHub() {\n    const dw = [\n      { title: 'ScriptOS', tag: 'Screenplay', color: '#d7340b', preview: '92 pages · 42 scenes', stats: [{ label: 'Pages', value: 92 }, { label: 'Scripts', value: 3 }] },\n      { title: 'Studio', tag: 'Assets', color: '#6366f1', preview: '14 concepts · 42 scenes', stats: [{ label: 'Concepts', value: 14 }, { label: 'Scenes', value: 42 }] },\n      { title: 'Lounge', tag: 'Crew', color: '#10b981', preview: '9 crew · 12 tasks', stats: [{ label: 'Crew', value: 9 }, { label: 'Tasks', value: '8/12' }] },\n      { title: 'Timeline', tag: 'Schedule', color: '#f59e0b', preview: '5 milestones', stats: [{ label: 'Milestones', value: 5 }, { label: 'Budget', value: '$10.8k' }] },\n      { title: 'Portfolio', tag: 'Showcase', color: '#8b5cf6', preview: 'Pre-Production', stats: [{ label: 'Phase', value: 'PRE' }, { label: 'Type', value: 'Feature' }] },\n      { title: 'Distribution', tag: 'Launch', color: '#ec4899', preview: 'Picture Lock not yet', stats: [{ label: 'Phase', value: 'PRE' }, { label: 'Status', value: 'Active' }] },\n    ];\n    return {\n      deptWindows: dw.map(d => ({ ...d, border: `${d.color}30`, bg: `${d.color}14` })),\n      tasks: [\n        { title: 'Lock Scene 14 rewrite', check: '✓', color: '#10b981', textColor: 'rgba(224,221,174,0.4)', strike: 'line-through' },\n        { title: 'Confirm forklift for Day 3', check: '', color: 'rgba(255,255,255,0.25)', textColor: '#e0ddae', strike: 'none' },\n        { title: 'Send Day 3 call sheet', check: '', color: 'rgba(255,255,255,0.25)', textColor: '#e0ddae', strike: 'none' },\n      ],\n      budgetItems: [\n        { category: 'Cast (4 roles)', amount: '4,200' },\n        { category: 'Visual FX (2)', amount: '2,900' },\n        { category: 'Camera & Crew (92 pg)', amount: '3,680' },\n      ],\n      festivals: [\n        { name: 'Sundance', status: 'submitted', color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },\n        { name: 'SXSW', status: 'planned', color: '#6b7280', bg: 'rgba(107,114,128,0.12)' },\n      ],\n    };\n  }\n\n  breakdownFlow() {\n    const sel = this.state.selectedCat;\n    const cats = [\n      { id: 'cast', label: 'Cast', color: '#d7340b', items: ['MARA', 'DEV'], est: '$4,200', pct: 90 },\n      { id: 'props', label: 'Props', color: '#a855f7', items: ['The Ledger', 'Crowbar', 'Manifest'], est: '$680', pct: 22 },\n      { id: 'vfx', label: 'VFX / SFX', color: '#0099ff', items: ['Spark rig', 'Atmos fog'], est: '$2,900', pct: 62 },\n      { id: 'wardrobe', label: 'Wardrobe', color: '#ffaa00', items: ['Dock coveralls', 'Mara\\u2019s trench'], est: '$540', pct: 18 },\n      { id: 'vehicles', label: 'Vehicles', color: '#ec4899', items: ['Forklift', 'Box truck'], est: '$1,500', pct: 40 },\n      { id: 'extras', label: 'Background', color: '#10b981', items: ['4 dockhands'], est: '$960', pct: 28 },\n    ];\n    const dim = (id) => (!sel || sel === id) ? 1 : 0.22;\n\n    // which categories each scene needs\n    const sceneCats = {\n      12: ['cast', 'props', 'wardrobe'],\n      13: ['cast', 'vfx', 'wardrobe', 'vehicles', 'extras'],\n      14: ['cast', 'props', 'vfx', 'wardrobe', 'vehicles', 'extras'],\n      15: ['cast', 'props'],\n    };\n    const mkScene = (num, title) => {\n      const list = sceneCats[num];\n      const match = !sel || list.includes(sel);\n      return {\n        num, title,\n        opacity: match ? 1 : 0.28,\n        rowBg: (sel && num === 14 && match) ? 'rgba(0,153,255,0.08)' : 'rgba(255,255,255,0.02)',\n        rowBorder: (sel && num === 14 && match) ? 'rgba(0,153,255,0.3)' : 'rgba(255,255,255,0.05)',\n        dots: cats.filter(c => list.includes(c.id)).map(c => ({ color: c.color, opacity: (!sel || sel === c.id) ? 1 : 0.2 })),\n      };\n    };\n\n    const daysUsing = Object.entries(sceneCats).filter(([, l]) => !sel || l.includes(sel));\n    const traceLine = sel\n      ? `${cats.find(c => c.id === sel).label} is tagged on ${daysUsing.length} scene${daysUsing.length === 1 ? '' : 's'} — so it shows up on every shoot day those scenes fall on, and rolls into exactly one budget line. Change it once, both update.`\n      : 'A single element tag propagates to every shoot day its scene lands on and to one budget category — no re-entry, no drift between departments.';\n\n    return {\n      catChips: cats.map(c => ({\n        label: c.label, color: c.color,\n        onClick: () => this.setState(st => ({ selectedCat: st.selectedCat === c.id ? null : c.id })),\n        bg: sel === c.id ? `${c.color}22` : 'rgba(255,255,255,0.03)',\n        border: sel === c.id ? `${c.color e, title, tod, cast, eighths) => {\n      const c = cond[`${ie}-${tod}`];\n      return { isStrip: true, isBanner: false, num, ie, title, tod, cast, eighths, bg: c.bg, ink: c.ink, divider: c.divider };\n    };\n    const banner = (day, location, pages, sceneCount) => ({ isBanner: true, isStrip: false, day, location, pages, sceneCount });\n\n    const board = [\n      banner('Day 1', 'Dockside Warehouse', '2 2/8', 3),\n      mkStrip('12', 'INT', 'Warehouse interior — Mara finds the ledger', 'DAY', ['1', '2'], '5/8'),\n      mkStrip('14', 'INT', 'Loading dock confrontation', 'NIGHT', ['1', '2', '4'], '1 2/8'),\n      mkStrip('13', 'EXT', 'Approach the dock', 'NIGHT', ['1', '2'], '3/8'),\n      banner('Day 2', 'Back Alley, 4th & Main', '1 0/8', 2),\n      mkStrip('18', 'EXT', 'Alley chase', 'NIGHT', ['1', '3'], '6/8'),\n      mkStrip('19', 'EXT', 'Alley aftermath', 'NIGHT', ['1'], '2/8'),\n      banner('Day 3', 'Downtown High-rise', '1 2/8', 2),\n      mkStrip('15', 'INT', 'Broker\\u2019s office — the deal', 'DAY', ['1', '2', '4'], '7/8'),\n      mkStrip('22', 'INT', 'Lobby exit', 'DAY', ['1'], '3/8'),\n    ];\n\n    const D = { S: { code: 'S', color: '#5fd39a', bg: 'rgba(16,185,129,0.16)' },\n                W: { code: 'W', color: '#7fb2ff', bg: 'rgba(0,153,255,0.16)' },\n                H: { code: 'H', color: '#f5c451', bg: 'rgba(245,158,11,0.16)' },\n                SW: { code: 'SW', color: '#5fd39a', bg: 'rgba(16,185,129,0.16)' },\n                WF: { code: 'WF', color: '#ff8a5c', bg: 'rgba(215,52,11,0.16)' },\n                SWF: { code: 'SWF', color: '#ff8a5c', bg: 'rgba(215,52,11,0.16)' },\n                off: { code: '·', color: 'rgba(224,221,174,0.25)', bg: 'transparent' } };\n\n    const doodRows = [\n      { no: 1, name: 'Mara Vance', cells: [D.SW, D.W, D.WF], days: 3 },\n      { no: 2, name: 'Dev Okafor', cells: [D.SW, D.H, D.WF], days: 2 },\n      { no: 3, name: 'Officer Kay', cells: [D.off, D.SWF, D.off], days: 1 },\n      { no: 4, name: 'The Broker', cells: [D.SW, D.H, D.WF], days: 2 },\n    ];\n\n    const mkView = (key, label) => ({\n      label,\n      onClick: () => this.setState({ boardView: key }),\n      bg: view === key ? 'rgba(16,185,129,0.16)' : 'transparent',\n      color: view === key ? '#5fd39a' : 'rgba(224,221,174,0.55)',\n    });\n\n    return {\n      views: [mkView('strips', 'Stripboard'), mkView('dood', 'Day Out of Days')],\n      isStrips: view === 'strips',\n      isDood: view === 'dood',\n      legend: [\n        { label: 'INT Day', color: '#e8e6d0' },\n        { label: 'EXT Day', color: '#e5c344' },\n        { label: 'INT Night', color: '#3a5a9a' },\n        { label: 'EXT Night', color: '#2f7d52' },\n      ],\n      board,\n      doodLegend: [\n        { code: 'S', label: 'Start', color: '#5fd39a', bg: 'rgba(16,185,129,0.16)' },\n        { code: 'W', label: 'Work', color: '#7fb2ff', bg: 'rgba(0,153,255,0.16)' },\n        { code: 'H', label: 'Hold', color: '#f5c451', bg: 'rgba(245,158,11,0.16)' },\n        { code: 'F', label: 'Finish', color: '#ff8a5c', bg: 'rgba(215,52,11,0.16)' },\n        { code: '·', label: 'Off', color: 'rgba(224,221,174,0.4)', bg: 'rgba(255,255,255,0.03)' },\n      ],\n      doodDays: ['Day 1', 'Day 2', 'Day 3'],\n      doodRows,\n      doodTotals: doodRows.map(r => ({ name: r.name, days: r.days, plural: r.days === 1 ? '' : 's' })),\n    };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const active = s.active;\n    const prodTab = s.prodTab;\n    const mkSub = (key, label) => ({\n      label,\n      onClick: () => this.setState({ prodTab: key }),\n      color: prodTab === key ? '#e0ddae' : 'rgba(224,221,174,0.4)',\n      borderColor: prodTab === key ? '#6366f1' : 'transparent',\n    });\n    const mk = (key, label) => ({\n      label,\n      onClick: () => this.setState({ active: key }),\n      color: active === key ? '#e0ddae' : 'rgba(224,221,174,0.4)',\n      borderColor: active === key ? '#d7340b' : 'transparent',\n    });\n\n    return {\n      tabs: [mk('write', 'WRITE'), mk('insights', 'INSIGHTS'), mk('history', 'HISTORY'), mk('audio', 'AUDIO')],\n      isWrite: active === 'write',\n      isInsights: active === 'insights',\n      isHistory: active === 'history',\n      isAudio: active === 'audio',\n\n      breakdownOpen: s.breakdownOpen,\n      breakdownArrow: s.breakdownOpen ? '\\u2212' : '+',\n      toggleBreakdown: () => this.setState(st => ({ breakdownOpen: !st.breakdownOpen })),\n\n      charsOpen: s.charsOpen,\n      charsArrow: s.charsOpen ? '\\u2212' : '+',\n      toggleChars: () => this.setState(st => ({ charsOpen: !st.charsOpen })),\n\n      lintOpen: s.lintOpen,\n      lintArrow: s.lintOpen ? '\\u2212' : '+',\n      toggleLint: () => this.setState(st => ({ lintOpen: !st.lintOpen })),\n\n      sprintActive: s.sprintActive,\n      sprintBtnLabel: s.sprintActive ? 'Pause' : 'Resume',\n      sprintBtnColor: s.sprintActive ? '#d7340b' : '#e0ddae',\n      toggleSprint: () => this.setState(st => ({ sprintActive: !st.sprintActive })),\n\n      viewOptions: [\n        { label: 'Typewriter Mode', checked: s.typewriter, onChange: () => this.setState(st => ({ typewriter: !st.typewriter })) },\n        { label: 'Dark Mode Preview', checked: s.darkPreview, onChange: () => this.setState(st => ({ darkPreview: !st.darkPreview })) },\n        { label: 'Scene Numbers', checked: s.sceneNumbers, onChange: () => this.setState(st => ({ sceneNumbers: !st.sceneNumbers })) },\n        { label: 'DRAFT Watermark', checked: s.watermark, onChange: () => this.setState(st => ({ watermark: !st.watermark })) },\n      ],\n\n      quickInsert: ['scene', 'action', 'character', 'dialogue', 'transition', 'note'],\n\n      characters: [\n        { name: 'MARA', pct: 38, lines: 64, scenes: 22 },\n        { name: 'DEV', pct: 24, lines: 41, scenes: 17 },\n        { name: 'OFFICER KAY', pct: 14, lines: 20, scenes: 9 },\n        { name: 'THE BROKER', pct: 9, lines: 12, scenes: 5 },\n      ],\n\n      lintIssues: [\n        { type: 'warning', color: '#eab308', line: 112, message: 'Character name inconsistent — \"MARA\" vs \"MARA V.\"' },\n        { type: 'info', color: '#3b82f6', line: 203, message: 'Scene runs long — consider splitting.' },\n      ],\n\n      revisions: [\n        { label: 'Draft 3', date: 'Jul 2, 4:12 PM', stats: '2,140 lines · 18,204 words' },\n        { label: 'Draft 2', date: 'Jun 28, 9:05 AM', stats: '1,980 lines · 16,850 words' },\n        { label: 'Draft 1', date: 'Jun 20, 2:30 PM', stats: '1,600 lines · 13,400 words' },\n      ],\n\n      stashItems: [\n        { text: '\"You don\\u2019t get to walk away from this one, Dev.\"', date: 'Jul 3' },\n        { text: 'MARA lights a cigarette. Doesn\\u2019t look at him.', date: 'Jun 30' },\n      ],\n\n      audioRefs: [\n        { title: 'Loading Dock — mood ref.mp3', duration: '2:14' },\n        { title: 'Tense strings sketch.wav', duration: '1:02' },\n        { title: 'Ending theme draft v2.mp3', duration: '3:40' },\n      ],\n\n      ...this.breakdownFlow(),\n      ...this.stripboard(),\n      ...this.castingBoard(),\n      ...this.loungeDock(),\n      ...this.editorScreen(),\n      ...this.editorScreen8b(),\n      ...this.projectsHub(),\n      ...this.studioLibrary(),\n      ...this.portfolioDist(),\n\n      phases: [\n        { name: 'Development', color: '#ffaa00', owns: 'status: concept. ScriptOS draft, beats/outline, treatment or lookbook, early concept pins, casting wishlist. Nothing dated or on-set yet.' },\n        { name: 'Pre-Production', color: '#0099ff', owns: 'status: pre-production. Breakdown \\u2192 stripboard schedule (eighths), day-out-of-days, call sheets, budget_items, locations, crew & casting.' },\n        { name: 'Production', color: '#d7340b', owns: 'status: in-production. Principal photography: scenes.status planned \\u2192 shot \\u2192 wrapped, dailies into the Library, daily reports.' },\n        { name: 'Post-Production', color: '#a855f7', owns: 'status: post-production. Editorial, review & approval (asset_comments, Frame.io-style), sound, reference clips, VFX.' },\n        { name: 'Delivery', color: '#00cc66', owns: 'status: completed. Pitch/showcase (portfolio_blocks), campaigns, festival_submissions, deliverables, share links.' },\n      ],\n\n      coreOwns: ['Script content', 'Format (screenplay/teleplay/\\u2026)', 'Scenes \\u2192', 'Script Breakdown \\u2192', 'Beats', 'Characters + Bible (JSONB)', 'Title Page', 'Versions / Lock'],\n\n      flows: [\n        { module: 'Schedule & Call Sheets', phase: 'Pre-Production', color: '#0099ff', reads: 'Scenes (+ est_duration eighths)', arrow: '\\u2192', becomes: 'stripboard packed into scenes.shoot_day, day-out-of-days, call sheets \\u2014 the 1st-AD auto-scheduler groups by location & clusters nights.' },\n        { module: 'Breakdown \\u2192 Budget', phase: 'Pre-Production', color: '#0099ff', reads: 'Script Breakdown elements', arrow: '\\u2192', becomes: 'budget_items lines + procurement (props/VFX/wardrobe). The bridge that should exist \\u2014 today the breakdown is hardcoded and wired to nothing.' },\n        { module: 'Casting', phase: 'Pre-Production', color: '#0099ff', reads: 'Characters', arrow: '\\u2192', becomes: 'character_castings (character_name \\u2194 crew_user_id) + character_references for look/casting boards. Not shown on the story page.' },\n        { module: 'Concept / Ref Shots', phase: 'Development', color: '#ffaa00', reads: 'Scenes', arrow: '\\u2192', becomes: 'scene_references \\u2194 concept_assets \\u2014 reference frames pinned per scene, plus later shot/clip search.' },\n        { module: 'Soundtrack', phase: 'Post / Dev', color: '#ffaa00', reads: 'Beats / scene mood', arrow: '\\u2192', becomes: 'reference songs & needle-drops via spotify_connections, tied to the moment they score.' },\n        { module: 'Dailies / Library', phase: 'Production', color: '#d7340b', reads: 'Scenes', arrow: '\\u2192', becomes: 'footage filed against the scene it covers, reviewed in the Frame.io-style approval modal (asset_comments).' },\n        { module: 'Pitch & Showcase', phase: 'Delivery', color: '#00cc66', reads: 'Logline, beats, characters, budget, crew', arrow: '\\u2192', becomes: 'portfolio_blocks snapshots \\u2014 an ordered board that doubles as pitch deck and public showcase.' },\n        { module: 'Campaigns', phase: 'Distribution', color: '#00cc66', reads: 'Title, audience', arrow: '\\u2192', becomes: 'campaigns with platform, target_demographic, budget vs spend, flight window.' },\n      ],\n\n      globals: [\n        { name: 'ScriptOS', note: 'The story owner. Script, scenes, beats, breakdown, bible, revisions & lock.' },\n        { name: 'Studio', note: 'Everything derived: concept boards, schedule, casting, library, promos, pitch \\u2014 the working floor.' },\n        { name: 'Lounge', note: 'channels.project_id NULL = global/community, set = project-scoped. Text/voice, threads, DMs, presence, WebRTC. Docks to the active project.' },\n        { name: 'Portfolio / Showcase', note: 'portfolio_projects.source_project_id links finished work back to its production; public via share_token.' },\n        { name: 'Distribution', note: 'Campaigns, festival_submissions, deliverables \\u2014 the outbound department.' },\n        { name: 'Projects Hub', note: 'Not a toggle \\u2014 the container. Owns the phase pipeline, budget_items, timeline_items, tasks, milestones.' },\n      ],\n\n      peopleMoney: [\n        { node: 'Jobs board', note: 'jobs.role + rate, optionally linked to a budget_items line via budget_item_id.' },\n        { node: 'Applications', note: 'job_applications \\u2014 accepting one writes a real project_crew row (not just a status flip).' },\n        { node: 'Project crew', note: 'project_crew membership \\u2014 the key that RLS uses for who can see/edit the whole project.' },\n        { node: 'Casting', note: 'character_castings binds a crew member to a screenplay character.' },\n        { node: 'Budget', note: 'budget_items: amount vs actual_cost; kSub('schedule', 'Schedule'), mkSub('crew', 'Crew')],\n      isStory: prodTab === 'story',\n      isSchedule: prodTab === 'schedule',\n      isCrew: prodTab === 'crew',\n\n      beats: [\n        { title: 'Inciting Incident', content: 'Mara finds the ledger in the warehouse and realizes Dev has been skimming.' },\n        { title: 'The Confrontation', content: 'Loading dock, night. Mara corners Dev before the shipment arrives.' },\n        { title: 'Midpoint Reversal', content: 'The Broker was watching the whole time — new player enters the game.' },\n        { title: 'Climax Setup', content: 'Officer Kay closes in as Mara and Dev scramble to cut a deal.' },\n      ],\n\n      scenes: [\n        { num: 12, title: 'Warehouse Interior', tod: 'DAY', location: 'Dockside Warehouse', day: 3, status: 'wrapped', statusColor: '#10b981', statusBg: 'rgba(16,185,129,0.12)', statusBorder: 'rgba(16,185,129,0.3)' },\n        { num: 13, title: 'Loading Dock', tod: 'NIGHT', location: 'Dockside Warehouse', day: 3, status: 'wrapped', statusColor: '#10b981', statusBg: 'rgba(16,185,129,0.12)', statusBorder: 'rgba(16,185,129,0.3)' },\n        { num: 14, title: 'Alley Chase', tod: 'NIGHT', location: 'Back Alley, 4th & Main', day: 4, status: 'shot', statusColor: '#f59e0b', statusBg: 'rgba(245,158,11,0.12)', statusBorder: 'rgba(245,158,11,0.3)' },\n        { num: 15, title: 'Broker\\u2019s Office', tod: 'DAY', location: 'Downtown High-rise', day: 5, status: 'planned', statusColor: '#9ca3af', statusBg: 'rgba(156,163,175,0.1)', statusBorder: 'rgba(156,163,175,0.25)' },\n      ],\n\n      crew: [\n        { initials: 'MV', name: 'Mara Vance (playing)', role: 'Lead — Director of Photography', statusColor: '#10b981' },\n        { initials: 'JR', name: 'Jamie Ruiz', role: '1st AD', statusColor: '#10b981' },\n        { initials: 'TK', name: 'Toni Kade', role: 'Gaffer', statusColor: '#6b7280' },\n        { initials: 'SL', name: 'Sam Lowe', role: 'Sound Mixer', statusColor: '#6b7280' },\n      ],\n
