text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:10px;\">Dialogue balance<\u002Fdiv>\n          <sc-for list=\"{{ dialogueBalance }}\" as=\"db\" hint-placeholder-count=\"3\">\n            <div style=\"margin-bottom:9px;\">\n              <div style=\"display:flex; justify-content:space-between; font-size:9.5px; color:rgba(224,221,174,0.6); margin-bottom:4px;\"><span>{{ db.name }}<\u002Fspan><span>{{ db.pct }}%<\u002Fspan><\u002Fdiv>\n              <div style=\"height:3px; background:rgba(255,255,255,0.06); border-radius:2px;\"><div style=\"height:100%; width:{{ db.pct }}%; background:{{ db.color }}; border-radius:2px;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- PAGE + MARGIN GUTTER -->\n        <div style=\"flex:1; min-width:0; background:#040710; display:flex; flex-direction:column;\">\n          <div style=\"flex:1; overflow-y:auto; padding:32px 20px; display:flex; justify-content:center; gap:0;\">\n\n            <div style=\"width:100%; max-width:600px; background:#f4f0e3; border-radius:3px 0 0 3px; box-shadow:-8px 20px 60px rgba(0,0,0,0.55); padding:48px 58px; font-family:'Courier New',Courier,monospace; color:#1a1712; position:relative;\">\n\n              <sc-for list=\"{{ pageBlocks8b }}\" as=\"b\" hint-placeholder-count=\"8\">\n                <sc-if value=\"{{ b.isSlug }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"position:relative; margin:24px 0 4px;\">\n                    <div style=\"font-size:13px; font-weight:700; letter-spacing:0.5px;\">{{ b.text }}<\u002Fdiv>\n                    <!-- production-aware chip row: the thing FD/Arc structurally can't show -->\n                    <div style=\"display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;\">\n                      <span style=\"font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.5px; color:{{ b.statusColor }}; background:{{ b.statusBg }}; border:1px solid {{ b.statusBorder }}; border-radius:99px; padding:3px 9px;\">{{ b.statusLabel }}<\u002Fspan>\n                      <span style=\"font-family:'DM Mono',monospace; font-size:9px; color:#6b6350; background:rgba(0,0,0,0.05); border-radius:99px; padding:3px 9px;\">Day {{ b.shootDay }}<\u002Fspan>\n                      <span style=\"font-family:'DM Mono',monospace; font-size:9px; color:#6b6350; background:rgba(0,0,0,0.05); border-radius:99px; padding:3px 9px;\">{{ b.eighths }} pp<\u002Fspan>\n                      <span style=\"font-family:'DM Mono',monospace; font-size:9px; color:#7d5a1f; background:rgba(217,119,6,0.1); border-radius:99px; padding:3px 9px;\">~{{ b.budget }} est.<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ b.isAction }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px; line-height:1.55; margin:0 0 12px;\">{{ b.text }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ b.isChar }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px; font-weight:700; padding-left:38%; margin:6px 0 0;\">{{ b.text }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ b.isDialogue }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:13px; line-height:1.5; margin:0 22% 12px 25%;\">{{ b.text }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <!-- CONNECTED MARGIN GUTTER -->\n            <div style=\"width:230px; flex-shrink:0; background:#0a131e; border:1px solid rgba(224,221,174,0.08); border-left:none; border-radius:0 8px 8px 0; padding:16px 14px; display:flex; flex-direction:column; gap:10px;\">\n              <div style=\"font-size:8px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:2px;\">Margin — routes to a department<\u002Fdiv>\n              <sc-for list=\"{{ marginNotes }}\" as=\"mn\" hint-placeholder-count=\"4\">\n                <div onclick=\"{{ mn.onClick }}\" style=\"background:rgba(255,255,255,0.02); border:1px solid {{ mn.border }}; border-left:3px solid {{ mn.color }}; border-radius:8px; padding:10px 11px; cursor:pointer;\">\n                  <div style=\"display:flex; align-items:center; gap:6px; margin-bottom:5px;\">\n                    <span style=\"font-size:8.5px; letter-spacing:1px; text-transform:uppercase; color:{{ mn.color }};\">{{ mn.type }}<\u002Fspan>\n                    <span style=\"margin-left:auto; font-size:8px; color:rgba(224,221,174,0.3);\">{{ mn.author }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:11px; color:rgba(224,221,174,0.75); line-height:1.4;\">{{ mn.text }}<\u002Fdiv>\n                  <sc-if value=\"{{ mn.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.06); font-size:10px; color:{{ mn.color }};\">{{ mn.routeText }} →<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button style=\"font-size:10.5px; padding:8px; background:rgba(255,255,255,0.03); border:1px dashed rgba(255,255,255,0.12); border-radius:7px; color:rgba(224,221,174,0.5); cursor:pointer;\">+ Tag this line…<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- BIDIRECTIONAL + MULTIPLAYER CALLOUTS -->\n    <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-top:20px;\">\n      <div style=\"background:rgba(99,102,241,0.06); border:1px solid rgba(99,102,241,0.22); border-radius:12px; padding:18px 20px;\">\n        <div style=\"font-size:12px; color:#a5b4fc; margin-bottom:6px;\">↔ Bidirectional structure<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.6); line-height:1.6;\">Drag a beat on the Board and a scaffold slugline + action appears in the page at that point. Rewrite a scene's length here and the stripboard's page-eighths and shoot-day grouping update live — structure and prose are the same document, not two synced copies.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(16,185,129,0.06); border:1px solid rgba(16,185,129,0.22); border-radius:12px; padding:18px 20px;\">\n        <div style=\"font-size:12px; color:#5fd39a; margin-bottom:6px;\">⇄ Role-aware multiplayer<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.6); line-height:1.6;\">Switch \"viewing as\" above — a director's shot note anchors to the line and shows up in the shot list, an AD's page-count read shows up in the schedule, a writer's revision goes to Stash. Same page, different lens, real routing — not shared cursors.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:18px 20px;\">\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.5); margin-bottom:6px;\">AI — off by default, opt-in only<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.6); line-height:1.6;\">No AI on the writing surface itself — filmmakers need to trust the page with their scripts. If AI assist ships at all, it lives behind a per-project toggle in Settings, disabled until a writer turns it on — never a bar sitting on the page by default.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"8a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n      <span style=\"background:#d7340b; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">8A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">ScriptOS — the script surface itself<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; overflow:hidden; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <!-- toolbar -->\n      <div style=\"display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid rgba(224,221,174,0.07); background:#070d18;\">\n        <div>\n          <div style=\"font-size:13px; color:#e0ddae;\">Femme Fatale<\u002Fdiv>\n          <div style=\"font-size:10px; color:rgba(224,221,174,0.4);\">Draft 3 · autosaved 2m ago<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:2px; margin-left:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:9px; padding:3px;\">\n          <sc-for list=\"{{ editorTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ t.onClick }}\" style=\"font-size:11.5px; padding:7px 14px; border:none; border-radius:6px; cursor:pointer; background:{{ t.bg }}; color:{{ t.color }};\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-left:auto; display:flex; align-items:center; gap:14px;\">\n          <div style=\"display:flex; align-items:center;\">\n            <sc-for list=\"{{ collab }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <span style=\"width:24px; height:24px; border-radius:50%; background:{{ p.color }}; color:#040710; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:-6px; border:2px solid #070d18;\">{{ p.initials }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <span style=\"font-size:10.5px; color:rgba(224,221,174,0.4);\">{{ pageInfo }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; min-height:560px;\">\n\n        <!-- STORY MAP nav -->\n        <div style=\"width:240px; flex-shrink:0; border-right:1px solid rgba(224,221,174,0.07); background:#060b13; padding:14px 12px; overflow-y:auto;\">\n          <div style=\"display:flex; justify-content:space-between; font-size:8px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:12px; padding:0 4px;\">\n            <span>Story Map<\u002Fspan><span style=\"opacity:0.6;\">{{ sceneCount }} sc<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ storyMap }}\" as=\"sc\" hint-placeholder-count=\"5\">\n            <sc-if value=\"{{ sc.actBreak }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:6px; margin:8px 0 6px; padding:0 4px;\">\n                <div style=\"flex:1; height:1px; background:rgba(224,221,174,0.1);\"><\u002Fdiv>\n                <span style=\"font-size:7px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4);\">{{ sc.actBreak }}<\u002Fspan>\n                <div style=\"flex:1; height:1px; background:rgba(224,221,174,0.1);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <button onclick=\"{{ sc.onClick }}\" style=\"width:100%; text-align:left; background:{{ sc.bg }}; border:none; border-left:2px solid {{ sc.accent }}; border-radius:0 7px 7px 0; padding:8px 6px 8px 8px; margin-bottom:2px; cursor:pointer;\">\n              <div style=\"display:flex; align-items:center; gap:5px; margin-bottom:5px;\">\n                <span style=\"font-size:8px; color:{{ sc.color }}; opacity:0.85;\">{{ sc.type }}<\u002Fspan>\n                <span style=\"flex:1; font-size:9.5px; color:{{ sc.nameColor }}; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ sc.name }}<\u002Fspan>\n                <span style=\"font-size:7px; color:rgba(224,221,174,0.35);\">{{ sc.wc }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:2px; background:rgba(224,221,174,0.06); border-radius:1px; overflow:hidden;\"><div style=\"height:100%; width:{{ sc.bar }}%; background:{{ sc.color }};\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- CENTER -->\n        <div style=\"flex:1; min-width:0; background:#040710; display:flex; flex-direction:column;\">\n\n          <!-- WRITE / PREVIEW: the screenplay page -->\n          <sc-if value=\"{{ isPage }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex:1; overflow-y:auto; padding:36px 20px; display:flex; justify-content:center;\">\n              <div style=\"width:100%; max-width:620px; background:#f4f0e3; border-radius:3px; box-shadow:0 20px 60px rgba(0,0,0,0.55); padding:56px 66px; font-family:'Courier New',Courier,monospace; color:#1a1712; position:relative;\">\n                <div style=\"position:absolute; top:20px; right:28px; font-size:10px; color:#9a8f70;\">{{ pageNum }}.<\u002Fdiv>\n                <sc-for list=\"{{ pageBlocks }}\" as=\"b\" hint-placeholder-count=\"8\">\n                  <sc-if value=\"{{ b.isSlug }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"position:relative; font-size:13px; font-weight:700; letter-spacing:0.5px; margin:26px 0 12px;\">\n                      <span style=\"position:absolute; left:-42px; font-weight:400; color:#a89a72;\">{{ b.no }}<\u002Fspan>\n                      <span style=\"position:absolute; right:-42px; font-weight:400; color:#a89a72;\">{{ b.no }}<\u002Fspan>\n                      {{ b.text }}\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isAction }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:13px; line-height:1.55; margin:0 0 12px;\">{{ b.text }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isChar }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:13px; font-weight:700; padding-left:38%; margin:6px 0 0;\">{{ b.text }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isParen }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:13px; padding-left:30%; color:#4a4436;\">{{ b.text }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isDialogue }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:relative; font-size:13px; line-height:1.5; margin:0 22% 12px 25%;\">\n                      <sc-if value=\"{{ b.active }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"position:absolute; left:-14px; top:0; bottom:0; width:2px; background:#d7340b;\"><\u002Fspan>\n                      <\u002Fsc-if>\n                      {{ b.text }}\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ b.isTrans }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:13px; font-weight:700; text-align:right; margin:12px 0;\">{{ b.text }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- status bar: element type + smart hint (Write only) -->\n            <sc-if value=\"{{ isWriteMode }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; align-items:center; gap:14px; padding:10px 20px; border-top:1px solid rgba(224,221,174,0.07); background:#070d18;\">\n                <span style=\"font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:#ff8a5c; background:rgba(215,52,11,0.12); border:1px solid rgba(215,52,11,0.3); border-radius:6px; padding:4px 10px;\">Dialogue<\u002Fspan>\n                <span style=\"font-size:11px; color:rgba(224,221,174,0.45);\">⏎ Enter → Character · Tab → Parenthetical · ⌘↵ → Action<\u002Fspan>\n                <span style=\"margin-left:auto; font-size:11px; color:rgba(224,221,174,0.4);\">Fountain · scene 14 / 42<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- BOARD -->\n          <sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; overflow-y:auto; padding:28px; display:flex; flex-wrap:wrap; gap:16px; align-content:flex-start;\">\n              <sc-for list=\"{{ boardCards }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <div style=\"width:230px; background:#0a131e; border:1px solid rgba(255,255,255,0.06); border-top:2px solid {{ c.color }}; border-radius:12px; padding:16px;\">\n                  <div style=\"display:flex; justify-content:space-between; margin-bottom:8px;\">\n                    <span style=\"font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:rgba(224,221,174,0.45);\">Scene {{ c.no }}<\u002Fspan>\n                    <span style=\"font-size:9px; color:{{ c.color }};\">{{ c.wc }}w<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px; font-weight:700; color:{{ c.color }}; margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ c.name }}<\u002Fdiv>\n                  <div style=\"font-size:11px; color:rgba(224,221,174,0.4); line-height:1.5; min-height:44px;\">{{ c.note }}<\u002Fdiv>\n                  <div style=\"display:flex; gap:5px; flex-wrap:wrap; margin-top:10px;\">\n                    <sc-for list=\"{{ c.cast }}\" as=\"cn\" hint-placeholder-count=\"2\">\n                      <span style=\"font-size:9px; color:#ffaa00; background:rgba(255,170,0,0.1); padding:2px 6px; border-radius:3px;\">{{ cn }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- STATS -->\n          <sc-if value=\"{{ isStats }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; overflow-y:auto; padding:32px;\">\n              <div style=\"display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:32px;\">\n                <sc-for list=\"{{ statCards }}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <div style=\"background:#0a131e; border:1px solid rgba(224,221,174,0.08); border-radius:12px; padding:16px 14px;\">\n                    <div style=\"font-size:26px; font-weight:700; color:{{ s.color }}; line-height:1; margin-bottom:6px;\">{{ s.value }}<\u002Fdiv>\n                    <div style=\"font-size:8px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:3px;\">{{ s.label }}<\u002Fdiv>\n                    <div style=\"font-size:9px; color:rgba(224,221,174,0.35);\">{{ s.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:8px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:12px;\">Scene Timeline · length = word count, color = shoot condition<\u002Fdiv>\n              <div style=\"display:flex; height:34px; gap:2px; background:#0a131e; border-radius:6px; padding:4px;\">\n                <sc-for list=\"{{ timeline }}\" as=\"seg\" hint-placeholder-count=\"6\">\n                  <div style=\"flex:{{ seg.flex }}; background:{{ seg.color }}; border-radius:3px; opacity:0.85;\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:20px; margin-top:16px;\">\n                <div style=\"flex:1;\">\n                  <div style=\"font-size:8px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:8px;\">Dialogue vs Action<\u002Fdiv>\n                  <div style=\"display:flex; height:18px; border-radius:5px; overflow:hidden;\"><div style=\"width:54%; background:#6366f1;\"><\u002Fdiv><div style=\"flex:1; background:#d7340b;\"><\u002Fdiv><\u002Fdiv>\n                  <div style=\"display:flex; justify-content:space-between; margin-top:5px; font-size:9px;\"><span style=\"color:#8a93f0;\">54% Dialogue<\u002Fspan><span style=\"color:#ff8a5c;\">46% Action<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:20px; max-width:900px;\">\n      <div style=\"font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:12px;\">What changed about the script UI<\u002Fdiv>\n      <ul style=\"color:rgba(224,221,174,0.65); font-family:'Cormorant Garamond',serif; font-size:16px; line-height:1.7; padding-left:18px; margin:0;\">\n        <li>The page is the hero — a real typeset screenplay on a proper page, not vanilla-on-black text. Industry format: bold sluglines, indented character cues, blocked dialogue, right-aligned transitions, all in Courier.<\u002Fli>\n        <li>Scene numbers sit in both margins (production convention), and the current line gets a quiet sinopia focus bar instead of the whole surface competing for attention.<\u002Fli>\n        <li>A status bar names the element you're on and shows the keystroke that creates the next one — the Fountain grammar, surfaced instead of hidden.<\u002Fli>\n        <li>The Story Map keeps the proportional word bars and act breaks it already has, but the page beside it finally reads like a screenplay.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"7a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n      <span style=\"background:#e0ddae; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">7A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">The Lounge — docked to the work, bridged to Discord<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:36px 40px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <div style=\"margin-bottom:24px;\">\n        <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#10b981; margin-bottom:8px;\">Cross-cutting · comms<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:2px; color:#e0ddae;\">Docked, not a detour<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:rgba(224,221,174,0.5); line-height:1.6; max-width:820px; margin-top:8px;\">The Lounge shouldn't be a full context-switch away from writing or scheduling. It docks to the right of whatever you're doing on the active project — project channels stay one glance away, and community channels (<span style=\"color:#e0ddae;\">channels.project_id = NULL<\u002Fspan>) are always reachable. Collapse it to a rail when you need the room.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- WORKSPACE + DOCK -->\n      <div style=\"display:flex; gap:0; border:1px solid rgba(224,221,174,0.1); border-radius:12px; overflow:hidden; min-height:440px; background:#040710;\">\n\n        <!-- the work -->\n        <div style=\"flex:1; padding:22px; display:flex; flex-direction:column; gap:14px; background:repeating-linear-gradient(135deg, rgba(224,221,174,0.015) 0 12px, transparent 12px 24px);\">\n          <div style=\"display:flex; align-items:center; gap:10px;\">\n            <span style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4);\">Active work · FEMME FATALE<\u002Fspan>\n            <span style=\"font-size:10px; color:#ff8a5c; background:rgba(215,52,11,0.12); border:1px solid rgba(215,52,11,0.3); border-radius:99px; padding:2px 9px;\">ScriptOS<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"flex:1; display:flex; align-items:center; justify-content:center; color:rgba(224,221,174,0.25); font-size:12px; letter-spacing:1px; text-align:center; line-height:1.7;\">your screenplay / stripboard / casting<br>— the Lounge sits alongside it, never on top of it<\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- dock -->\n        <sc-if value=\"{{ dockOpen }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"width:330px; flex-shrink:0; background:#070d18; border-left:1px solid rgba(224,221,174,0.1); display:flex; flex-direction:column;\">\n            <div style=\"padding:14px 16px; border-bottom:1px solid rgba(224,221,174,0.07); display:flex; align-items:center; justify-content:space-between;\">\n              <div>\n                <div style=\"font-size:12.5px; color:#e0ddae;\">Femme Fatale<\u002Fdiv>\n                <div style=\"font-size:10px; color:#5fd39a;\">{{ onlineCount }} online<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px;\">\n                <div style=\"display:flex;\">\n                  <sc-for list=\"{{ presence }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <span style=\"width:22px; height:22px; border-radius:50%; background:{{ p.color }}; color:#040710; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-left:-6px; border:2px solid #070d18;\">{{ p.initials }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button onclick=\"{{ toggleDock }}\" style=\"background:rgba(255,255,255,0.05); border:none; border-radius:6px; width:24px; height:24px; color:rgba(224,221,174,0.6); cursor:pointer; font-size:13px;\">›<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"flex:1; display:flex; min-height:0;\">\n              <!-- channel rail -->\n              <div style=\"width:132px; flex-shrink:0; border-right:1px solid rgba(224,221,174,0.06); padding:12px 8px; overflow-y:auto;\">\n                <div style=\"font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(224,221,174,0.35); padding:0 6px 6px;\">This project<\u002Fdiv>\n                <sc-for list=\"{{ projectChannels }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <button onclick=\"{{ c.onClick }}\" style=\"display:flex; align-items:center; gap:6px; width:100%; text-align:left; background:{{ c.bg }}; border:none; border-radius:6px; padding:7px 8px; color:{{ c.color }}; cursor:pointer; font-size:11.5px; margin-bottom:2px;\">\n                    <span style=\"color:{{ c.glyphColor }}; flex-shrink:0;\">{{ c.glyph }}<\u002Fspan>\n                    <span style=\"flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ c.name }}<\u002Fspan>\n                    <sc-if value=\"{{ c.badge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:8.5px; color:#5fd39a;\">{{ c.badge }}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n                <div style=\"font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(224,221,174,0.35); padding:12px 6px 6px;\">Community<\u002Fdiv>\n                <sc-for list=\"{{ communityChannels }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <button onclick=\"{{ c.onClick }}\" style=\"display:flex; align-items:center; gap:6px; width:100%; text-align:left; background:{{ c.bg }}; border:none; border-radius:6px; padding:7px 8px; color:{{ c.color }}; cursor:pointer; font-size:11.5px; margin-bottom:2px;\">\n                    <span style=\"color:{{ c.glyphColor }}; flex-shrink:0;\">{{ c.glyph }}<\u002Fspan>\n                    <span style=\"flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ c.name }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <!-- channel body -->\n              <div style=\"flex:1; display:flex; flex-direction:column; min-width:0;\">\n                <div style=\"padding:11px 14px; border-bottom:1px solid rgba(224,221,174,0.06); display:flex; align-items:center; gap:7px;\">\n                  <span style=\"color:{{ activeChannel.glyphColor }};\">{{ activeChannel.glyph }}<\u002Fspan>\n                  <span style=\"font-size:12px; color:#e0ddae;\">{{ activeChannel.name }}<\u002Fspan>\n                  <sc-if value=\"{{ activeChannel.locked }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px; color:rgba(224,221,174,0.4);\">private<\u002Fspan><\u002Fsc-if>\n                  <span style=\"margin-left:auto; font-size:9px; color:rgba(224,221,174,0.35);\">{{ activeChannel.policy }}<\u002Fspan>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ activeChannel.isVoice }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"flex:1; padding:16px 14px; display:flex; flex-direction:column; gap:12px;\">\n                    <div style=\"font-size:10.5px; color:rgba(224,221,174,0.4); letter-spacing:1px; text-transform:uppercase;\">In the room · WebRTC mesh<\u002Fdiv>\n                    <sc-for list=\"{{ voiceRoom }}\" as=\"v\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex; align-items:center; gap:10px;\">\n                        <span style=\"width:32px; height:32px; border-radius:50%; background:{{ v.color }}; color:#040710; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:{{ v.ring }};\">{{ v.initials }}<\u002Fspan>\n                        <span style=\"font-size:12px; color:#e0ddae;\">{{ v.name }}<\u002Fspan>\n                        <span style=\"margin-left:auto; font-size:10px; color:{{ v.stateColor }};\">{{ v.state }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ activeChannel.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"flex:1; padding:14px; display:flex; flex-direction:column; gap:14px; overflow-y:auto;\">\n                    <sc-for list=\"{{ messages }}\" as=\"m\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; gap:10px;\">\n                        <span style=\"width:26px; height:26px; border-radius:50%; background:{{ m.color }}; color:#040710; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">{{ m.initials }}<\u002Fspan>\n                        <div style=\"min-width:0;\">\n                          <div style=\"display:flex; align-items:baseline; gap:7px;\">\n                            <span style=\"font-size:11.5px; color:#e0ddae;\">{{ m.name }}<\u002Fspan>\n                            <span style=\"font-size:9px; color:rgba(224,221,174,0.35);\">{{ m.time }}<\u002Fspan>\n                            <sc-if value=\"{{ m.viaDiscord }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:8.5px; color:#8a9bf0; background:rgba(88,101,242,0.14); border-radius:4px; padding:1px 5px;\">via Discord<\u002Fspan><\u002Fsc-if>\n                          <\u002Fdiv>\n                          <div style=\"font-size:12px; color:rgba(224,221,174,0.7); line-height:1.5; margin-top:2px;\">{{ m.text }}<\u002Fdiv>\n                          <sc-if value=\"{{ m.thread }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:10px; color:#5fd39a; margin-top:4px;\">{{ m.thread }}<\u002Fdiv><\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <div style=\"font-size:10.5px; color:rgba(224,221,174,0.35); font-style:italic;\">{{ typing }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div style=\"padding:10px 12px; border-top:1px solid rgba(224,221,174,0.06);\">\n                  <div style=\"background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:9px 12px; font-size:11px; color:rgba(224,221,174,0.35);\">{{ composerHint }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- collapsed rail -->\n        <sc-if value=\"{{ dockClosed }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width:52px; flex-shrink:0; background:#070d18; border-left:1px solid rgba(224,221,174,0.1); display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:14px;\">\n            <button onclick=\"{{ toggleDock }}\" style=\"background:rgba(255,255,255,0.05); border:none; border-radius:6px; width:28px; height:28px; color:rgba(224,221,174,0.6); cursor:pointer; font-size:13px;\">‹<\u002Fbutton>\n            <sc-for list=\"{{ railGlyphs }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <div style=\"position:relative;\">\n                <span style=\"color:{{ g.color }}; font-size:14px;\">{{ g.glyph }}<\u002Fspan>\n                <sc-if value=\"{{ g.dot }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute; top:-2px; right:-4px; width:7px; height:7px; border-radius:50%; background:#d7340b;\"><\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"margin-top:auto; display:flex; flex-direction:column; gap:-4px;\">\n              <sc-for list=\"{{ presence }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <span style=\"width:20px; height:20px; border-radius:50%; background:{{ p.color }}; color:#040710; font-size:8px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:-4px; border:2px solid #070d18;\">{{ p.initials }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- DISCORD BRIDGE -->\n      <div style=\"margin-top:34px; padding-top:28px; border-top:1px solid rgba(224,221,174,0.08);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n          <span style=\"width:22px; height:22px; border-radius:6px; background:#5865f2; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700;\">D<\u002Fspan>\n          <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4);\">The Discord bridge — you already have the fields for it<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.45); line-height:1.5; margin-bottom:18px; max-width:840px;\"><span style=\"color:#e0ddae;\">profiles.discord_id / discord_username / discord_avatar<\u002Fspan> already exist in the schema. That's the identity half done — here's the rest of the surface, ordered by how cheap it is to ship.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <sc-for list=\"{{ discordRows }}\" as=\"d\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex; align-items:flex-start; gap:16px; background:rgba(88,101,242,0.05); border:1px solid rgba(88,101,242,0.18); border-radius:10px; padding:14px 18px;\">\n              <span style=\"font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:#a6b0f7; background:rgba(88,101,242,0.14); border:1px solid rgba(88,101,242,0.3); border-radius:5px; padding:4px 9px; flex-shrink:0; min-width:96px; text-align:center;\">{{ d.effort }}<\u002Fspan>\n              <div style=\"flex:1;\">\n                <div style=\"font-size:13px; color:#e0ddae; margin-bottom:3px;\">{{ d.title }}<\u002Fdiv>\n                <div style=\"font-size:12px; color:rgba(224,221,174,0.55); line-height:1.55;\">{{ d.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"6a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n      <span style=\"background:#a855f7; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">6A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">Casting — characters → cast → look-boards → crew<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:36px 40px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <div style=\"margin-bottom:26px;\">\n        <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#a855f7; margin-bottom:8px;\">Pre-Production · packaging<\u002Fdiv>\n        <div style=\"font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:2px; color:#e0ddae;\">The Casting Board<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:rgba(224,221,174,0.5); line-height:1.6; max-width:820px; margin-top:8px;\">Every character comes straight from the ScriptOS bible — you don't re-type the cast. Each one carries its own look-board (concept pins), the scenes it appears in, its Day-Out-of-Days number, and a casting slot that binds it to a real crew member or opens as a role you can post to the Jobs board.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:300px 1fr; gap:24px; align-items:start;\">\n\n        <!-- character list -->\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;\">\n            <span style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.4);\">From the bible<\u002Fspan>\n            <span style=\"font-size:11px; color:rgba(224,221,174,0.4);\">{{ castSummary }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ characters }}\" as=\"ch\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ ch.onClick }}\" style=\"display:flex; align-items:center; gap:12px; text-align:left; background:{{ ch.bg }}; border:1px solid {{ ch.border }}; border-left:3px solid {{ ch.accent }}; border-radius:10px; padding:12px 14px; cursor:pointer;\">\n              <span style=\"width:26px; height:26px; border-radius:50%; background:rgba(168,85,247,0.16); color:#c4b5fd; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">{{ ch.castNo }}<\u002Fspan>\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"font-size:13px; color:#e0ddae; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ ch.name }}<\u002Fdiv>\n                <div style=\"font-size:10.5px; color:rgba(224,221,174,0.45);\">{{ ch.roleType }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:9.5px; letter-spacing:0.5px; text-transform:uppercase; color:{{ ch.statusColor }}; background:{{ ch.statusBg }}; border:1px solid {{ ch.statusBorder }}; border-radius:99px; padding:3px 9px; flex-shrink:0;\">{{ ch.statusLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <!-- detail -->\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:26px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px;\">\n            <div>\n              <div style=\"font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; color:#e0ddae; line-height:1;\">{{ detail.name }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(224,221,174,0.45); margin-top:6px;\">{{ detail.full }} · Cast #{{ detail.castNo }} · {{ detail.roleType }}<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"font-size:10px; letter-spacing:1px; text-transform:uppercase; color:{{ detail.statusColor }}; background:{{ detail.statusBg }}; border:1px solid {{ detail.statusBorder }}; border-radius:99px; padding:5px 12px;\">{{ detail.statusLabel }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <!-- casting slot -->\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:10px;\">Casting · character_castings<\u002Fdiv>\n          <sc-if value=\"{{ detail.isCast }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; align-items:center; gap:12px; background:rgba(16,185,129,0.06); border:1px solid rgba(16,185,129,0.22); border-radius:10px; padding:14px 16px; margin-bottom:22px;\">\n              <span style=\"width:38px; height:38px; border-radius:50%; background:rgba(16,185,129,0.16); color:#5fd39a; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center;\">{{ detail.actorInitials }}<\u002Fspan>\n              <div style=\"flex:1;\">\n                <div style=\"font-size:13.5px; color:#e0ddae;\">{{ detail.actor }}<\u002Fdiv>\n                <div style=\"font-size:11px; color:rgba(224,221,174,0.45);\">Confirmed · crew member on this project<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"width:8px; height:8px; border-radius:50%; background:#10b981;\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ detail.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; align-items:center; gap:14px; background:rgba(245,158,11,0.06); border:1px dashed rgba(245,158,11,0.35); border-radius:10px; padding:14px 16px; margin-bottom:22px;\">\n              <div style=\"flex:1;\">\n                <div style=\"font-size:13px; color:#f5c451;\">Open role — not yet cast<\u002Fdiv>\n                <div style=\"font-size:11px; color:rgba(224,221,174,0.45); margin-top:2px;\">Post it and applicants who are accepted become project crew automatically.<\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"font-size:11.5px; padding:9px 15px; background:rgba(139,92,246,0.16); border:1px solid rgba(139,92,246,0.4); border-radius:8px; color:#c4b5fd; cursor:pointer; white-space:nowrap;\">Post to Jobs →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- look board -->\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:10px;\">Look board · character_references → concept_assets<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px;\">\n            <sc-for list=\"{{ detail.refs }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"aspect-ratio:3/4; border-radius:8px; border:1px solid rgba(255,255,255,0.08); background:repeating-linear-gradient(45deg, rgba(168,85,247,0.06) 0 8px, rgba(168,85,247,0.11) 8px 16px); display:flex; align-items:flex-end; padding:10px;\">\n                <span style=\"font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:rgba(224,221,174,0.5); font-family:'DM Mono',monospace;\">{{ r }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <!-- appears in -->\n          <div style=\"display:flex; gap:32px; flex-wrap:wrap;\">\n            <div style=\"flex:1; min-width:200px;\">\n              <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:10px;\">Appears in · scenes.cast_list<\u002Fdiv>\n              <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n                <sc-for list=\"{{ detail.scenes }}\" as=\"sc\" hint-placeholder-count=\"4\">\n                  <span style=\"font-size:11.5px; color:#e0ddae; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); padding:4px 10px; border-radius:6px;\">Sc {{ sc }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:150px;\">\n              <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:10px;\">Schedule footprint<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:rgba(224,221,174,0.6); line-height:1.7;\">{{ detail.sceneCount }} scenes<br>{{ detail.dayCount }} shoot days · DOOD #{{ detail.castNo }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:28px; padding:16px 20px; background:rgba(168,85,247,0.06); border:1px solid rgba(168,85,247,0.24); border-radius:10px; font-size:12.5px; color:rgba(224,221,174,0.7); line-height:1.6;\">\n        <span style=\"color:#c4b5fd; font-weight:600;\">One record, four connections:<\u002Fspan> a character binds to a crew member (<span style=\"color:#e0ddae;\">character_castings<\u002Fspan>), carries a look-board (<span style=\"color:#e0ddae;\">character_references<\u002Fspan>), inherits its scenes and shoot days (<span style=\"color:#e0ddae;\">scenes.cast_list<\u002Fspan>), and — when open — becomes a <span style=\"color:#e0ddae;\">jobs<\u002Fspan> posting whose accepted applicant joins <span style=\"color:#e0ddae;\">project_crew<\u002Fspan>. Casting is where the story spine and the people spine meet.\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"5a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n      <span style=\"background:#10b981; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">5A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">The stripboard — real 1st-AD scheduling from scenes<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:36px 40px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; gap:16px;\">\n        <div>\n          <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#10b981; margin-bottom:8px;\">Pre-Production · scheduling<\u002Fdiv>\n          <div style=\"font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:2px; color:#e0ddae;\">Stripboard &amp; Day-Out-of-Days<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:4px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:9px; padding:4px;\">\n          <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"2\">\n            <button onclick=\"{{ v.onClick }}\" style=\"font-size:12px; padding:8px 14px; border:none; border-radius:6px; cursor:pointer; background:{{ v.bg }}; color:{{ v.color }};\">{{ v.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px; color:rgba(224,221,174,0.5); line-height:1.6; max-width:820px; margin-bottom:24px;\">Each scene becomes a colored strip — the color is the shoot condition (INT/EXT × day/night), the length is page count in eighths. The AD stacks strips into shoot days, and the same data auto-builds the Day-Out-of-Days so you can see every actor's Start / Work / Hold / Finish at a glance.<\u002Fdiv>\n\n      <!-- STRIPBOARD -->\n      <sc-if value=\"{{ isStrips }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; flex-wrap:wrap; gap:16px; margin-bottom:22px;\">\n          <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; align-items:center; gap:8px;\">\n              <span style=\"width:22px; height:12px; border-radius:2px; background:{{ l.color }}; border:1px solid rgba(0,0,0,0.3);\"><\u002Fspan>\n              <span style=\"font-size:11.5px; color:rgba(224,221,174,0.6);\">{{ l.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:4px;\">\n          <sc-for list=\"{{ board }}\" as=\"row\" hint-placeholder-count=\"8\">\n            <sc-if value=\"{{ row.isBanner }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:center; gap:12px; background:#0a131e; border:1px solid rgba(224,221,174,0.1); border-radius:6px; padding:10px 16px; margin-top:8px;\">\n                <span style=\"font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; color:#e0ddae;\">{{ row.day }}<\u002Fspan>\n                <span style=\"font-size:11.5px; color:rgba(224,221,174,0.45);\">{{ row.location }}<\u002Fspan>\n                <span style=\"margin-left:auto; font-size:11px; color:rgba(224,221,174,0.5); font-family:'DM Mono',monospace;\">{{ row.pages }} pp · {{ row.sceneCount }} sc<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ row.isStrip }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex; align-items:center; gap:0; background:{{ row.bg }}; border:1px solid rgba(0,0,0,0.35); border-radius:4px; overflow:hidden; min-height:38px;\">\n                <div style=\"width:44px; text-align:center; font-size:13px; font-weight:700; color:{{ row.ink }}; border-right:1px solid {{ row.divider }}; padding:8px 0;\">{{ row.num }}<\u002Fdiv>\n                <div style=\"width:52px; text-align:center; font-size:10.5px; letter-spacing:1px; color:{{ row.ink }}; opacity:0.85; border-right:1px solid {{ row.divider }};\">{{ row.ie }}<\u002Fdiv>\n                <div style=\"flex:1; padding:0 14px; font-size:12.5px; color:{{ row.ink }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ row.title }}<\u002Fdiv>\n                <div style=\"width:70px; text-align:center; font-size:11px; letter-spacing:1px; color:{{ row.ink }}; opacity:0.8; border-left:1px solid {{ row.divider }};\">{{ row.tod }}<\u002Fdiv>\n                <div style=\"min-width:84px; padding:0 12px; display:flex; gap:4px; justify-content:center; border-left:1px solid {{ row.divider }};\">\n                  <sc-for list=\"{{ row.cast }}\" as=\"cn\" hint-placeholder-count=\"2\">\n                    <span style=\"font-size:10.5px; font-weight:700; color:{{ row.ink }}; opacity:0.85;\">{{ cn }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"width:56px; text-align:center; font-size:11px; font-family:'DM Mono',monospace; color:{{ row.ink }}; opacity:0.8; border-left:1px solid {{ row.divider }};\">{{ row.eighths }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- DAY OUT OF DAYS -->\n      <sc-if value=\"{{ isDood }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px;\">\n          <sc-for list=\"{{ doodLegend }}\" as=\"dl\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex; align-items:center; gap:7px;\">\n              <span style=\"width:26px; text-align:center; font-size:10.5px; font-weight:700; color:{{ dl.color }}; background:{{ dl.bg }}; border-radius:4px; padding:2px 0;\">{{ dl.code }}<\u002Fspan>\n              <span style=\"font-size:11.5px; color:rgba(224,221,174,0.55);\">{{ dl.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"overflow-x:auto;\">\n          <div style=\"display:grid; grid-template-columns:200px repeat(3, 1fr); gap:2px; min-width:560px;\">\n            <div style=\"padding:10px 12px; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:rgba(224,221,174,0.4);\">Cast Member<\u002Fdiv>\n            <sc-for list=\"{{ doodDays }}\" as=\"dh\" hint-placeholder-count=\"3\">\n              <div style=\"padding:10px 8px; text-align:center; font-size:11px; color:#e0ddae; background:#0a131e; border-radius:5px 5px 0 0;\">{{ dh }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ doodRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:center; gap:10px; padding:11px 12px; background:rgba(255,255,255,0.02); border-radius:5px;\">\n                <span style=\"width:20px; height:20px; border-radius:50%; background:rgba(215,52,11,0.16); color:#ff8a5c; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">{{ r.no }}<\u002Fspan>\n                <span style=\"font-size:12.5px; color:#e0ddae;\">{{ r.name }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ r.cells }}\" as=\"cell\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex; align-items:center; justify-content:center; padding:11px 0; background:rgba(255,255,255,0.02); border-radius:5px;\">\n                  <span style=\"min-width:30px; text-align:center; font-size:11px; font-weight:700; color:{{ cell.color }}; background:{{ cell.bg }}; border-radius:5px; padding:4px 0;\">{{ cell.code }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:24px; margin-top:20px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ doodTotals }}\" as=\"t\" hint-placeholder-count=\"4\">\n            <div style=\"font-size:11.5px; color:rgba(224,221,174,0.5);\">{{ t.name }}: <span style=\"color:#e0ddae; font-family:'DM Mono',monospace;\">{{ t.days }} work day{{ t.plural }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"margin-top:28px; padding:16px 20px; background:rgba(16,185,129,0.06); border:1px solid rgba(16,185,129,0.24); border-radius:10px; font-size:12.5px; color:rgba(224,221,174,0.7); line-height:1.6;\">\n        <span style=\"color:#5fd39a; font-weight:600;\">All from one source:<\u002Fspan> strip color reads <span style=\"color:#e0ddae;\">scenes.time_of_day<\u002Fspan> + INT/EXT, length reads <span style=\"color:#e0ddae;\">est_duration<\u002Fspan> (eighths), the shoot day is <span style=\"color:#e0ddae;\">scenes.shoot_day<\u002Fspan>, and the DOOD is computed from each scene's <span style=\"color:#e0ddae;\">cast_list<\u002Fspan> — the same import-from-screenplay + auto-schedule that already exists, given a proper view.\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"4a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n      <span style=\"background:#0099ff; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">4A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">The missing bridge — script breakdown → schedule → budget<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:36px 40px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; flex-wrap:wrap; gap:16px;\">\n        <div>\n          <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#0099ff; margin-bottom:8px;\">One tag, two destinations<\u002Fdiv>\n          <div style=\"font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:2px; color:#e0ddae;\">Tag an element once — it lands in the schedule and the budget<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px; color:rgba(224,221,174,0.5); line-height:1.6; max-width:820px; margin-bottom:24px;\">In real pre-production the breakdown is the hinge: you tag every element a scene needs (cast, props, VFX, wardrobe, vehicles, background), and those tags roll up two ways — into the <span style=\"color:#10b981;\">stripboard<\u002Fspan> that packs scenes into shoot days, and into the <span style=\"color:#f59e0b;\">budget<\u002Fspan> by category. Click a category to trace it across all three.<\u002Fdiv>\n\n      <!-- category selector -->\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px;\">\n        <sc-for list=\"{{ catChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ c.onClick }}\" style=\"display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 14px; background:{{ c.bg }}; border:1px solid {{ c.border }}; border-radius:99px; color:{{ c.textColor }}; cursor:pointer; opacity:{{ c.opacity }};\">\n            <span style=\"width:9px; height:9px; border-radius:50%; background:{{ c.color }};\"><\u002Fspan>{{ c.label }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <button onclick=\"{{ clearCat }}\" style=\"font-size:11.5px; padding:8px 14px; background:transparent; border:1px solid rgba(224,221,174,0.12); border-radius:99px; color:rgba(224,221,174,0.5); cursor:pointer;\">{{ clearLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; align-items:start;\">\n\n        <!-- ===== 1. BREAKDOWN ===== -->\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:20px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:4px;\">\n            <span style=\"font-size:11px; color:#040710; background:#d7340b; border-radius:4px; padding:2px 7px; font-weight:700;\">1<\u002Fspan>\n            <span style=\"font-size:14px; color:#e0ddae;\">Breakdown<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:11px; color:rgba(224,221,174,0.4); margin-bottom:16px;\">Scene 14 · INT. Loading Dock · NIGHT<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px;\">\n            <sc-for list=\"{{ breakdownGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n              <div style=\"opacity:{{ g.opacity }}; transition:opacity 0.2s;\">\n                <div style=\"font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:{{ g.color }}; margin-bottom:7px;\">{{ g.label }}<\u002Fdiv>\n                <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n                  <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                    <span style=\"font-size:11.5px; color:#e0ddae; background:{{ g.chipBg }}; border:1px solid {{ g.chipBorder }}; padding:4px 9px; border-radius:6px;\">{{ it }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== 2. SCHEDULE (stripboard) ===== -->\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:20px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:4px;\">\n            <span style=\"font-size:11px; color:#040710; background:#10b981; border-radius:4px; padding:2px 7px; font-weight:700;\">2<\u002Fspan>\n            <span style=\"font-size:14px; color:#e0ddae;\">Stripboard<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:11px; color:rgba(224,221,174,0.4); margin-bottom:16px;\">{{ scheduleHint }}<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px;\">\n            <sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"2\">\n              <div>\n                <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px;\">\n                  <span style=\"width:6px; height:6px; border-radius:50%; background:{{ d.color }};\"><\u002Fspan>\n                  <span style=\"font-size:11.5px; letter-spacing:0.5px; color:#e0ddae;\">{{ d.label }}<\u002Fspan>\n                  <span style=\"font-size:10.5px; color:rgba(224,221,174,0.4);\">{{ d.meta }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                  <sc-for list=\"{{ d.scenes }}\" as=\"sc\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex; align-items:center; gap:10px; background:{{ sc.rowBg }}; border:1px solid {{ sc.rowBorder }}; border-left:3px solid {{ d.color }}; border-radius:7px; padding:9px 11px; opacity:{{ sc.opacity }}; transition:opacity 0.2s;\">\n                      <span style=\"font-size:12px; font-weight:700; color:#e0ddae; width:24px;\">{{ sc.num }}<\u002Fspan>\n                      <span style=\"flex:1; font-size:11.5px; color:rgba(224,221,174,0.7); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ sc.title }}<\u002Fspan>\n                      <div style=\"display:flex; gap:3px;\">\n                        <sc-for list=\"{{ sc.dots }}\" as=\"dot\" hint-placeholder-count=\"3\">\n                          <span style=\"width:7px; height:7px; border-radius:50%; background:{{ dot.color }}; opacity:{{ dot.opacity }};\"><\u002Fspan>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- ===== 3. BUDGET ===== -->\n        <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:20px;\">\n          <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:4px;\">\n            <span style=\"font-size:11px; color:#040710; background:#f59e0b; border-radius:4px; padding:2px 7px; font-weight:700;\">3<\u002Fspan>\n            <span style=\"font-size:14px; color:#e0ddae;\">Budget rollup<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:11px; color:rgba(224,221,174,0.4); margin-bottom:16px;\">budget_items · by category<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ budgetLines }}\" as=\"b\" hint-placeholder-count=\"6\">\n              <div style=\"opacity:{{ b.opacity }}; transition:opacity 0.2s;\">\n                <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;\">\n                  <div style=\"display:flex; align-items:center; gap:8px;\">\n                    <span style=\"width:8px; height:8px; border-radius:50%; background:{{ b.color }};\"><\u002Fspan>\n                    <span style=\"font-size:12.5px; color:#e0ddae;\">{{ b.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:12px; color:rgba(224,221,174,0.7); font-family:'DM Mono',monospace;\">{{ b.est }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:4px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden;\">\n                  <div style=\"height:100%; width:{{ b.pct }}%; background:{{ b.color }};\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; padding-top:14px; border-top:1px solid rgba(224,221,174,0.1);\">\n              <span style=\"font-size:13px; color:#e0ddae;\">Scene 14 total<\u002Fspan>\n              <span style=\"font-size:14px; color:#f59e0b; font-family:'DM Mono',monospace;\">{{ budgetTotal }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <div style=\"margin-top:28px; padding:16px 20px; background:rgba(0,153,255,0.06); border:1px solid rgba(0,153,255,0.24); border-radius:10px; font-size:12.5px; color:rgba(224,221,174,0.7); line-height:1.6;\">\n        <span style=\"color:#4db8ff; font-weight:600;\">Why it matters:<\u002Fspan> {{ traceLine }} Today ScriptOS renders these element tags as hardcoded demo data wired to nothing — making it derive from the script and write to <span style=\"color:#e0ddae;\">scenes<\u002Fspan> + <span style=\"color:#e0ddae;\">budget_items<\u002Fspan> is what turns the breakdown from decoration into the backbone of pre-production.\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"3a\" style=\"scroll-margin-top:40px; width:100%; max-width:1280px;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\">\n      <span style=\"background:#e0ddae; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">3A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">The Cavern — production data architecture &amp; real workflow<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:40px 44px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n      <!-- ===== PHASE PIPELINE with the LOCK gate ===== -->\n      <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:6px;\">The production timeline — the gate that governs everything<\u002Fdiv>\n      <div style=\"font-size:12px; color:rgba(224,221,174,0.45); line-height:1.55; margin-bottom:18px; max-width:760px;\">The spine isn't fixed — <span style=\"color:#e0ddae;\">projects.settings<\u002Fspan> drives a per-type phase template: a Feature runs Concept → Pre → Prod → Post → Completed, a Documentary skips Pre, a Music Video collapses to Concept → Shoot → Edit, a Podcast to Plan → Record → Edit → Publish. The <span style=\"color:#e0ddae;\">projects.status<\u002Fspan> enum is the single source for which phase a project is in.<\u002Fdiv>\n      <div style=\"display:flex; align-items:stretch; gap:0; margin-bottom:40px; flex-wrap:wrap;\">\n        <sc-for list=\"{{ phases }}\" as=\"ph\" hint-placeholder-count=\"5\">\n          <div style=\"flex:1; min-width:150px;\">\n            <div style=\"height:4px; background:{{ ph.color }}; border-radius:2px; margin-bottom:12px;\"><\u002Fdiv>\n            <div style=\"font-size:12.5px; letter-spacing:1px; text-transform:uppercase; color:{{ ph.color }}; margin-bottom:8px;\">{{ ph.name }}<\u002Fdiv>\n            <div style=\"font-size:12px; color:rgba(224,221,174,0.5); line-height:1.5; padding-right:14px;\">{{ ph.owns }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px; margin:-24px 0 40px; padding:12px 18px; background:rgba(215,52,11,0.08); border:1px solid rgba(215,52,11,0.28); border-radius:10px; width:fit-content;\">\n        <span style=\"width:9px; height:9px; border-radius:2px; background:#d7340b;\"><\u002Fspan>\n        <span style=\"font-size:12.5px; color:#e0ddae;\"><span style=\"color:#ff8a5c; font-weight:600;\">SCRIPT LOCK<\u002Fspan> sits between Development and Pre-Production. Nothing on-set (call sheets, shoot-day status, dailies) should exist before it; nothing story-structural (rewriting beats/scenes) should be casual after it.<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- ===== THE CORE ===== -->\n      <div style=\"display:grid; grid-template-columns:340px 1fr; gap:36px; align-items:start;\">\n\n        <div style=\"background:rgba(215,52,11,0.06); border:1px solid rgba(215,52,11,0.28); border-radius:14px; padding:24px;\">\n          <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#ff8a5c; margin-bottom:6px;\">The base context<\u002Fdiv>\n          <div style=\"font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; color:#e0ddae; margin-bottom:6px;\">ScriptOS<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:rgba(224,221,174,0.55); line-height:1.55; margin-bottom:18px;\">The story lives here and only here — every other module reads it, none re-own it. Two derived structures do the heavy lifting downstream: <span style=\"color:#ff8a5c;\">Scenes<\u002Fspan> (the parsed stripboard) and the <span style=\"color:#ff8a5c;\">Script Breakdown<\u002Fspan> (elements: props / VFX / wardrobe / cast). These are the bridges everything else hangs off.<\u002Fdiv>\n          <div style=\"font-size:10px; letter-spacing:2px; text-transform:uppercase; color:rgba(224,221,174,0.35); margin-bottom:10px;\">Owns (source of truth)<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:7px;\">\n            <sc-for list=\"{{ coreOwns }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <span style=\"font-size:12px; color:#e0ddae; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); padding:5px 11px; border-radius:6px;\">{{ o }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:16px;\">Branches out — each consumer reads ScriptOS one-way and derives its own artifact (real tables named)<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px;\">\n            <sc-for list=\"{{ flows }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex; align-items:center; gap:16px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-left:3px solid {{ f.color }}; border-radius:10px; padding:14px 18px;\">\n                <div style=\"width:140px; flex-shrink:0;\">\n                  <div style=\"font-size:13px; color:#e0ddae;\">{{ f.module }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:{{ f.color }}; margin-top:3px;\">{{ f.phase }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px; color:rgba(224,221,174,0.55); line-height:1.5;\"><span style=\"color:{{ f.color }};\">{{ f.reads }}<\u002Fspan> {{ f.arrow }} {{ f.becomes }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== GLOBAL / SHARED LAYER ===== -->\n      <div style=\"margin-top:36px; padding-top:28px; border-top:1px solid rgba(224,221,174,0.08);\">\n        <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:6px;\">Five departments — each a per-project toggle in projects.settings.modules<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.45); line-height:1.5; margin-bottom:16px; max-width:760px;\">Switching one off hides its hub tile + taskbar icon without deleting data. This is the top-level map of the suite.<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px;\">\n          <sc-for list=\"{{ globals }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:16px 18px;\">\n              <div style=\"font-size:13px; color:#e0ddae; margin-bottom:6px;\">{{ g.name }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:rgba(224,221,174,0.5); line-height:1.5;\">{{ g.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== PEOPLE & MONEY SPINE ===== -->\n      <div style=\"margin-top:36px; padding-top:28px; border-top:1px solid rgba(224,221,174,0.08);\">\n        <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:6px;\">The people &amp; money spine — packaging, runs across every phase<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.45); line-height:1.5; margin-bottom:16px; max-width:820px;\">One chain the story doesn't own but everything staffing depends on. Accepting an application is not cosmetic — it writes a real membership row that unlocks channel access, casting and RLS visibility.<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; align-items:stretch; gap:10px;\">\n          <sc-for list=\"{{ peopleMoney }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"flex:1; min-width:150px; background:rgba(139,92,246,0.06); border:1px solid rgba(139,92,246,0.22); border-radius:10px; padding:14px 16px;\">\n              <div style=\"font-size:12.5px; color:#c4b5fd; margin-bottom:5px;\">{{ p.node }}<\u002Fdiv>\n              <div style=\"font-size:11.5px; color:rgba(224,221,174,0.5); line-height:1.5;\">{{ p.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== PUBLIC BOUNDARY ===== -->\n      <div style=\"margin-top:36px; padding-top:28px; border-top:1px solid rgba(224,221,174,0.08);\">\n        <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:6px;\">The public boundary — snapshots, not references<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.45); line-height:1.5; margin-bottom:16px; max-width:820px;\">Logged-out visitors can't read source tables under RLS, so anything shared past the wall copies the data it needs at publish time rather than linking to it.<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px;\">\n          <sc-for list=\"{{ publicBoundary }}\" as=\"pb\" hint-placeholder-count=\"3\">\n            <div style=\"background:rgba(0,204,102,0.05); border:1px solid rgba(0,204,102,0.2); border-radius:10px; padding:14px 16px;\">\n              <div style=\"font-family:'DM Mono',monospace; font-size:12px; color:#5fd39a; margin-bottom:5px;\">{{ pb.route }}<\u002Fdiv>\n              <div style=\"font-size:11.5px; color:rgba(224,221,174,0.5); line-height:1.5;\">{{ pb.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== THE FIX CALLOUTS ===== -->\n      <div style=\"margin-top:36px; padding-top:28px; border-top:1px solid rgba(224,221,174,0.08);\">\n        <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(224,221,174,0.4); margin-bottom:6px;\">Architectural cleanup the model exposes — real debt in the schema today<\u002Fdiv>\n        <div style=\"font-size:12px; color:rgba(224,221,174,0.45); line-height:1.5; margin-bottom:16px; max-width:820px;\">Found while reading supabase-schema.sql. Each is a place where two things own what should be one.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <sc-for list=\"{{ fixes }}\" as=\"fx\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; gap:14px; align-items:flex-start;\">\n              <span style=\"font-size:11px; color:#ff8a5c; background:rgba(215,52,11,0.12); border:1px solid rgba(215,52,11,0.28); padding:3px 8px; border-radius:5px; flex-shrink:0; margin-top:2px;\">{{ fx.tag }}<\u002Fspan>\n              <span style=\"font-size:13px; color:rgba(224,221,174,0.7); line-height:1.55;\">{{ fx.text }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"2a\" style=\"scroll-margin-top:40px; width:100%;\">\n    <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px;\">\n      <span style=\"background:#6366f1; color:#040710; font-size:10px; letter-spacing:2px; font-weight:600; padding:3px 9px; border-radius:999px;\">2A<\u002Fspan>\n      <span style=\"color:rgba(224,221,174,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase;\">Studio — Production tab redesign<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:32px; flex-wrap:wrap; align-items:flex-start;\">\n      <div style=\"width:900px; background:#050a14; border:1px solid rgba(224,221,174,0.09); border-radius:16px; padding:36px 40px; box-shadow:0 24px 64px rgba(0,0,0,0.6);\">\n\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;\">\n          <div>\n            <div style=\"font-size:10px; letter-spacing:3px; text-transform:uppercase; color:#6366f1; margin-bottom:8px;\">Pre-Production<\u002Fdiv>\n            <div style=\"font-family:'Bebas Neue',sans-serif; font-size:38px; letter-spacing:2px; color:#e0ddae;\">Production Suite<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:8px;\">\n            <button style=\"font-size:11px; letter-spacing:1px; padding:9px 16px; background:transparent; border:1px solid rgba(224,221,174,0.15); border-radius:7px; color:#e0ddae; cursor:pointer;\">⎙ Export Schedule<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- sub-nav: was one monolithic 2-col grid, now 3 explicit zones -->\n        <div style=\"display:flex; gap:6px; margin:28px 0 30px; border-bottom:1px solid rgba(224,221,174,0.08); padding-bottom:0;\">\n          <sc-for list=\"{{ subtabs }}\" as=\"st\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ st.onClick }}\" style=\"p
